/* ---------- 附件（图片 / 文档） ---------- */
const TEXT_EXTS = ['txt','md','markdown','csv','tsv','json','jsonl','log','xml','yml','yaml','html','htm','js','mjs','cjs','ts','jsx','tsx','py','java','c','h','cpp','hpp','cs','go','rs','sql','sh','bash','bat','cmd','ps1','ini','toml','conf','cfg','css','scss','less','vue','php','rb','swift','kt','r','env','gitignore','dockerfile','properties'];
const IMG_MAX_DIM = 2048;

function readFileAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
function readFileAsText(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });
}

function compressImage(dataUrl, mime) {
  return new Promise((res) => {
    if (mime === 'image/svg+xml') { res(dataUrl); return; }
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width <= IMG_MAX_DIM && height <= IMG_MAX_DIM && dataUrl.length < 900 * 1024) { res(dataUrl); return; }
      const scale = Math.min(1, IMG_MAX_DIM / Math.max(width, height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      const ctx = canvas.getContext('2d');
      if (mime !== 'image/png') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const outMime = (mime === 'image/png' && dataUrl.length < 1500 * 1024) ? 'image/png' : 'image/jpeg';
      if (outMime === 'image/jpeg' && mime === 'image/png') {
        const c2 = document.createElement('canvas');
        c2.width = canvas.width; c2.height = canvas.height;
        const ctx2 = c2.getContext('2d');
        ctx2.fillStyle = '#ffffff';
        ctx2.fillRect(0, 0, c2.width, c2.height);
        ctx2.drawImage(canvas, 0, 0);
        res(c2.toDataURL('image/jpeg', 0.85));
        return;
      }
      res(canvas.toDataURL(outMime, 0.85));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

async function chatAddFiles(files, kind) {
  if (!files) return;
  const list = Array.isArray(files) ? files : Array.from(files);
  if (!list.length) return;

  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    const ext = (f.name ? f.name.split('.').pop() : '').toLowerCase();
    const isImgExt = ['png','jpg','jpeg','gif','webp','bmp','svg','ico'].includes(ext);
    const isImgMime = f.type && f.type.startsWith('image/');
    const isImg = isImgMime || isImgExt;

    let targetKind = kind || 'auto';
    if (targetKind === 'auto') {
      targetKind = isImg ? 'image' : 'doc';
    } else if (targetKind === 'image' && !isImg && (!f.type || !f.type.startsWith('image/'))) {
      targetKind = 'doc';
    } else if (targetKind === 'doc' && isImg) {
      targetKind = 'image';
    }

    if (targetKind === 'image') {
      if (f.size > 10 * 1024 * 1024) { toast('图片过大（>10MB）：' + (f.name || '图片'), 'error'); continue; }
      let name = f.name || '';
      if (!name || name === 'blob' || name === 'image.png') {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const ts = '' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
        let imgExt = 'png';
        if (f.type) {
          const m = f.type.match(/^image\/([a-zA-Z0-9_-]+)/);
          if (m && m[1]) imgExt = (m[1] === 'jpeg' ? 'jpg' : m[1]);
        }
        name = '截图_' + ts + (list.length > 1 ? '_' + (i + 1) : '') + '.' + imgExt;
      }
      let mime = f.type || '';
      if (!mime || !mime.startsWith('image/')) {
        mime = (ext === 'jpg' || ext === 'jpeg') ? 'image/jpeg' : (ext ? 'image/' + ext : 'image/png');
      }
      let data = await readFileAsDataURL(f);
      data = await compressImage(data, mime);
      CS.pending.push({ name, mime, size: f.size, kind: 'image', data });
      chatRenderChips();
    } else {
      let name = f.name || '未命名文档';
      if (ext === 'pdf' || (f.type && f.type === 'application/pdf')) {
        if (f.size > 5 * 1024 * 1024) { toast('PDF 过大（>5MB）：' + name, 'error'); continue; }
        const data = await readFileAsDataURL(f);
        CS.pending.push({ name, mime: 'application/pdf', size: f.size, kind: 'doc-pdf', data });
        chatRenderChips();
      } else if (TEXT_EXTS.includes(ext) || (f.type && (f.type.startsWith('text/') || f.type === 'application/json' || f.type === 'application/xml' || f.type === 'application/javascript'))) {
        if (f.size > 500 * 1024) { toast('文本文件过大（>500KB）：' + name, 'error'); continue; }
        let text = await readFileAsText(f);
        if (text.length > 120000) text = text.slice(0, 120000) + '\n…（内容过长已截断）';
        CS.pending.push({ name, mime: f.type || 'text/plain', size: f.size, kind: 'doc-text', data: text });
        chatRenderChips();
      } else {
        toast('暂不支持该文件类型（' + (ext || f.type || '未知') + '），支持图片、PDF 及各类代码/文本文件', 'error');
        continue;
      }
    }
  }

  const totalBytes = CS.pending.reduce((acc, it) => acc + (it.data ? it.data.length : 0), 0);
  if (totalBytes > 7 * 1024 * 1024) {
    toast('待发送附件总大小已接近 8MB 上限，请注意精简', 'warning');
  }

  chatRenderChips();
}

async function chatHandlePaste(ev) {
  const cd = ev.clipboardData || window.clipboardData;
  if (!cd) return;

  let files = [];
  if (cd.files && cd.files.length > 0) {
    files = Array.from(cd.files);
  } else if (cd.items && cd.items.length > 0) {
    for (let i = 0; i < cd.items.length; i++) {
      const it = cd.items[i];
      if (it.kind === 'file') {
        const f = it.getAsFile();
        if (f) files.push(f);
      }
    }
  }

  if (files.length > 0) {
    ev.preventDefault();
    if (ev.stopPropagation) ev.stopPropagation();
    await chatAddFiles(files, 'auto');
    const input = document.getElementById('chatInput');
    if (input) input.focus();
    return;
  }

  setTimeout(autoResizeInput, 0);
}

/* ---------- 构建发给 API 的 messages ---------- */
function chatBuildApiMessages(targetAssistantUid) {
  const HIST_KEEP = 40;
  const msgs = [];
  let msgsSlice = CS.msgs;
  if (targetAssistantUid) {
    const targetIdx = CS.msgs.findIndex(m => m.uid === targetAssistantUid);
    if (targetIdx >= 0) {
      msgsSlice = CS.msgs.slice(0, targetIdx);
    }
  }
  const filtered = msgsSlice.filter(m => m.role === 'user' || (m.role === 'assistant' && (m.content || m.reasoning)));
  let lastUserIdx = -1;
  for (let i = filtered.length - 1; i >= 0; i--) { if (filtered[i].role === 'user') { lastUserIdx = i; break; } }
  const slice = filtered.slice(-HIST_KEEP);
  const offset = filtered.length - slice.length;
  slice.forEach((m, i) => {
    const globalIdx = offset + i;
    if (m.role === 'assistant') { msgs.push({ role: 'assistant', content: m.content || '' }); return; }
    const isLast = globalIdx === lastUserIdx;
    let text = m.content || '';
    const parts = [];
    (m.attachments || []).forEach(a => {
      if (a.kind === 'image') {
        if (isLast) parts.push({ type: 'image_url', image_url: { url: a.data } });
        else text += (text ? '\n' : '') + '[图片: ' + a.name + ']';
      } else if (a.kind === 'doc-text') {
        text += (text ? '\n\n' : '') + '--- 附件文档: ' + a.name + ' ---\n' + a.data + '\n--- 文档结束 ---';
      } else if (a.kind === 'doc-pdf') {
        if (isLast) parts.push({ type: 'file', file: { filename: a.name, file_data: a.data } });
        else text += (text ? '\n' : '') + '[文档: ' + a.name + ']';
      }
    });
    if (parts.length) {
      parts.unshift({ type: 'text', text: text || '请查看我发送的附件内容' });
      msgs.push({ role: 'user', content: parts });
    } else {
      msgs.push({ role: 'user', content: text });
    }
  });
  return msgs;
}

/* ---------- 流式调用 /v1/chat/completions ---------- */
function chatExtractError(t) {
  if (!t) return '未知错误';
  if (typeof t === 'object') {
    const d = t.error || t.detail || t;
    if (typeof d === 'string') return d;
    let msg = d.message || d.error || '';
    if (d.last_error && !msg.includes(d.last_error)) msg += (msg ? '（最后错误: ' : '') + d.last_error + (msg ? '）' : '');
    if (d.suggestion && !msg.includes(d.suggestion)) msg += (msg ? ' (' : '') + d.suggestion + (msg ? ')' : '');
    return msg || JSON.stringify(d);
  }
  try {
    const j = JSON.parse(t);
    const d = j.error || j.detail || j;
    if (d) {
      if (typeof d === 'string') return d;
      let msg = d.message || d.error || '';
      if (d.last_error && !msg.includes(d.last_error)) msg += (msg ? '（最后错误: ' : '') + d.last_error + (msg ? '）' : '');
      if (d.suggestion && !msg.includes(d.suggestion)) msg += (msg ? ' (' : '') + d.suggestion + (msg ? ')' : '');
      if (!msg) msg = JSON.stringify(d);
      return msg;
    }
  } catch (e) {}
  if (typeof t === 'string' && t.trim().startsWith('<')) {
    const stripped = t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    if (stripped) return stripped.slice(0, 300);
  }
  return String(t).slice(0, 300) || '未知错误';
}

function chatIsRetryableError(err) {
  if (!err) return false;
  if (err.name === 'AbortError' || String(err.message || '').includes('abort')) return false;
  const str = String(err.message || err).toLowerCase();
  if (str.includes('http 400') || str.includes('http 401') || str.includes('http 404')) return false;
  if (str.includes('invalid_model') || str.includes('missing_model') || str.includes('unauth')) return false;
  return true;
}

async function chatRetryMessage(uid) {
  const aIdx = CS.msgs.findIndex(m => m.uid === uid);
  if (aIdx < 0) return;
  const aMsg = CS.msgs[aIdx];
  const curTask = chatCurrentTask();
  if (curTask) { toast('请等待当前回复完成或停止后再重试', 'info'); return; }
  
  // 若重试的是历史某轮消息，截断其后的多轮对话保持上下文一致
  if (aIdx < CS.msgs.length - 1 && CS.sid) {
    try {
      await api('/chat/sessions/' + CS.sid + '/truncate', { method: 'POST', body: JSON.stringify({ keep: aIdx }) });
      CS.msgs = CS.msgs.slice(0, aIdx + 1);
      chatRenderMessages();
    } catch (e) { toast('截断会话失败：' + e.message, 'error'); }
  }

  aMsg.error = '';
  aMsg.content = '';
  aMsg.reasoning = '';
  aMsg.reasoningSecs = 0;
  aMsg._reasoningDone = false;
  chatClearError(aMsg.uid);
  const md = document.getElementById('md-' + aMsg.uid);
  if (md) md.innerHTML = '';
  const rbox = document.getElementById('reasoning-' + aMsg.uid);
  if (rbox) rbox.remove();
  const copyBtn = document.getElementById('row-' + aMsg.uid)?.querySelector('.msg-copy-btn');
  if (copyBtn) copyBtn.remove();
  const sid0 = CS.sid;
  await chatRunAssistant(aMsg, sid0);
}

async function chatStream(messages, h, task) {
  const body = { model: chatActiveModel(), messages, stream: !!CS.cfg.stream };
  // 思考强度：default 不传参（跟随上游默认），其余值透传给网关/上游
  if (CS.effort && CS.effort !== 'default') body.reasoning_effort = CS.effort;
  task.abort = new AbortController();
  const doFetch = () => fetch('/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (S.token || '') },
    body: JSON.stringify(body),
    signal: task.abort.signal,
  });
  if (!CS.cfg.stream) {
    const resp = await doFetch();
    const t = await resp.text();
    if (!resp.ok) throw new Error('HTTP ' + resp.status + '：' + chatExtractError(t));
    let j;
    try { j = JSON.parse(t); } catch(e) { throw new Error('上游返回非JSON格式：' + t.slice(0, 200)); }
    if (j.error) throw new Error(chatExtractError(j.error));
    const msg = (j.choices && j.choices[0] && j.choices[0].message) || {};
    let got = false;
    if (msg.reasoning_content) { got = true; h.onReasoning(msg.reasoning_content); }
    if (msg.content) { got = true; h.onContent(msg.content); }
    if (j.usage) h.onUsage(j.usage);
    if (!got) throw new Error('上游未返回有效内容（响应内容为空）');
    return;
  }
  const resp = await doFetch();
  if (!resp.ok) { const t = await resp.text(); throw new Error('HTTP ' + resp.status + '：' + chatExtractError(t)); }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  let receivedAny = false;
  let rawErrorText = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line || line.startsWith(':')) continue;
      // 1) 检测非 data: 行是否为裸 JSON 错误（如部分故障上游直接返回 {"error": ...}）
      if (!line.startsWith('data:')) {
        if (line.startsWith('{') && line.endsWith('}')) {
          try {
            const rawJ = JSON.parse(line);
            if (rawJ.error || rawJ.detail) {
              throw new Error(chatExtractError(rawJ));
            }
          } catch (e) {
            if (e.message && !e.message.includes('JSON')) throw e;
          }
        }
        if (!line.startsWith('event:') && !line.startsWith('id:') && !line.startsWith('retry:')) {
          if (line.length > 3) rawErrorText = line;
        }
        continue;
      }
      const payload = line.slice(5).trim();
      if (payload === '[DONE]') {
        if (!receivedAny) {
          throw new Error(rawErrorText ? ('上游错误：' + rawErrorText) : '上游未返回任何有效内容（响应为空或连接被重置）');
        }
        return;
      }
      let j;
      try { j = JSON.parse(payload); } catch (e) { continue; }
      if (j.error) throw new Error(chatExtractError(j.error));
      const c = j.choices && j.choices[0];
      const d = (c && c.delta) || {};
      const reasoning = d.reasoning_content || d.reasoning;
      if (reasoning) { receivedAny = true; h.onReasoning(reasoning); }
      if (d.content) { receivedAny = true; h.onContent(d.content); }
      if (j.usage) h.onUsage(j.usage);
    }
  }
  if (!receivedAny && !task.aborted) {
    throw new Error(rawErrorText ? ('上游错误：' + rawErrorText) : '上游未返回任何有效内容（响应为空或连接提前关闭）');
  }
}

/* 执行助手生成任务（含自动重试与实时报错显示） */
async function chatRunAssistant(aMsg, sid0) {
  const task = { sid: sid0, aMsg, abort: null, done: false, aborted: false };
  CS.tasks.push(task);
  chatUpdateSendBtn();
  const startedAt = Date.now();
  chatSetCalling(aMsg.uid, '调用中…………');
  chatClearError(aMsg.uid);

  let renderTimer = null;
  const scheduleRender = () => {
    if (renderTimer) return;
    renderTimer = setTimeout(() => {
      renderTimer = null;
      const md = document.getElementById('md-' + aMsg.uid);
      if (md) {
        md.innerHTML = mdRender(aMsg.content) + (task.done ? '' : '<span class="stream-cursor"></span>');
        chatScrollBottom();
      }
    }, 80);
  };

  const MAX_RETRIES = 2; // 最多自动重试 2 次（共 3 次尝试）
  let attempt = 0;
  let finalErr = null;

  while (attempt <= MAX_RETRIES) {
    if (task.aborted) break;
    if (attempt > 0) {
      chatSetCalling(aMsg.uid, '正在自动重试 (' + attempt + '/' + MAX_RETRIES + ')…………');
    }
    try {
      await chatStream(chatBuildApiMessages(aMsg.uid), {
        onReasoning: (delta) => {
          chatRemoveCalling(aMsg.uid);
          chatClearError(aMsg.uid);
          aMsg.reasoning += delta;
          let rbox = document.getElementById('reasoning-' + aMsg.uid);
          if (!rbox) {
            const body = document.getElementById('row-' + aMsg.uid)?.querySelector('.msg-assist-body');
            if (body) body.insertAdjacentHTML('afterbegin', reasoningShell(aMsg.uid, 1, '正在深度思考<span class="reasoning-thinking-dot"><i></i><i></i><i></i></span>', ''));
            rbox = document.getElementById('reasoning-' + aMsg.uid);
          }
          const rbody = document.getElementById('reasoning-body-' + aMsg.uid);
          if (rbox) rbox.dataset.open = '1';
          if (rbody) {
            rbody.textContent = aMsg.reasoning;
            rbody.scrollTop = rbody.scrollHeight;
          }
        },
        onContent: (delta) => {
          chatRemoveCalling(aMsg.uid);
          chatClearError(aMsg.uid);
          if (!aMsg._reasoningDone) {
            aMsg._reasoningDone = true;
            aMsg.reasoningSecs = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
            const rbox0 = document.getElementById('reasoning-' + aMsg.uid);
            if (rbox0) {
              if (aMsg.reasoning) {
                rbox0.dataset.open = '0';
                const lbl = rbox0.querySelector('.reasoning-label');
                if (lbl) lbl.textContent = '已深度思考（用时 ' + aMsg.reasoningSecs + ' 秒）';
              } else {
                rbox0.remove();
              }
            }
          }
          aMsg.content += delta;
          scheduleRender();
        },
        onUsage: (u) => {
          aMsg.prompt_tokens = u.prompt_tokens || 0;
          aMsg.completion_tokens = u.completion_tokens || 0;
        },
      }, task);
      if (!aMsg.content && !aMsg.reasoning && !task.aborted) {
        throw new Error('上游未返回任何有效内容（响应为空）');
      }
      finalErr = null;
      break;
    } catch (err) {
      const isAbort = err && (err.name === 'AbortError' || String(err.message || '').includes('abort') || task.aborted);
      if (isAbort) {
        task.aborted = true;
        finalErr = null;
        break;
      }
      finalErr = err;
      const retryable = chatIsRetryableError(err);
      // 遇到报错实时显示报错信息；若可重试且未输出正文且在重试次数内，则不打断重试
      if (retryable && attempt < MAX_RETRIES && !aMsg.content) {
        attempt++;
        const errDetail = err.message || String(err);
        const warnMsg = '第 ' + attempt + ' 次调用失败：' + errDetail + '，正在自动重试 (' + attempt + '/' + MAX_RETRIES + ')...';
        chatRenderError(aMsg.uid, warnMsg, true);
        toast('调用遇到问题：' + errDetail + '，正在自动重试 (' + attempt + '/' + MAX_RETRIES + ')...', 'info');
        await new Promise((resolve) => {
          const timer = setTimeout(resolve, 1500);
          if (task.abort) {
            task.abort.signal.addEventListener('abort', () => { clearTimeout(timer); resolve(); }, { once: true });
          }
        });
        continue;
      }
      // 不可重试、已有正文输出中途中断、或重试次数用尽
      break;
    }
  }

  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  chatRemoveCalling(aMsg.uid);
  const hadReasoning = !!aMsg.reasoning;
  if (hadReasoning && !aMsg.reasoningSecs) {
    aMsg.reasoningSecs = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
  }
  aMsg._reasoningDone = true;
  task.done = true;
  CS.tasks = CS.tasks.filter(t => t !== task);
  chatUpdateSendBtn();

  const rbox = document.getElementById('reasoning-' + aMsg.uid);
  if (rbox) {
    if (hadReasoning) {
      rbox.dataset.open = '0';
      const lbl = rbox.querySelector('.reasoning-label');
      if (lbl) lbl.textContent = '已深度思考' + (aMsg.reasoningSecs ? '（用时 ' + aMsg.reasoningSecs + ' 秒）' : '');
    } else {
      rbox.remove();
    }
  }
  const md = document.getElementById('md-' + aMsg.uid);
  if (md) md.innerHTML = mdRender(aMsg.content);

  if (finalErr && !task.aborted) {
    const errText = '请求失败：' + (finalErr.message || finalErr);
    aMsg.error = errText;
    chatRenderError(aMsg.uid, errText, false);
    toast(errText, 'error');
  } else if (!finalErr && !aMsg.content && !aMsg.reasoning && !task.aborted) {
    const errText = '请求失败：未收到任何回复内容（响应为空）';
    aMsg.error = errText;
    chatRenderError(aMsg.uid, errText, false);
    toast(errText, 'error');
  } else if (!finalErr) {
    aMsg.error = '';
    chatClearError(aMsg.uid);
  }

  if (aMsg.content) {
    const rowEl = document.getElementById('row-' + aMsg.uid);
    if (rowEl) {
      const bodyEl = rowEl.querySelector('.msg-assist-body');
      if (bodyEl && !bodyEl.querySelector('.msg-copy-btn')) {
        bodyEl.insertAdjacentHTML('beforeend', '<button class="msg-copy-btn" data-copy-uid="' + aMsg.uid + '">' + CHAT_ICONS.copy + '复制</button>');
      }
    }
  }

  if (aMsg.content || aMsg.reasoning) {
    api('/chat/sessions/' + sid0 + '/messages', {
      method: 'POST',
      body: JSON.stringify({
        role: 'assistant', content: aMsg.content, reasoning: aMsg.reasoning,
        model: aMsg.model, prompt_tokens: aMsg.prompt_tokens || 0, completion_tokens: aMsg.completion_tokens || 0,
        latency_ms: Date.now() - startedAt,
      }),
    }).then(() => chatLoadSessions()).catch(() => {});
  } else if (aMsg.error) {
    // 报错但无内容：保留气泡供查看报错与点击重试，不删除！
  } else if (task.aborted) {
    // 用户主动停止且没有任何内容：移除占位气泡
    CS.msgs = CS.msgs.filter(x => x !== aMsg);
    const r = document.getElementById('row-' + aMsg.uid);
    if (r) r.remove();
  }
  if (CS.sid === sid0) chatScrollBottom();
}

/* ---------- 发送 ---------- */
async function chatSend() {
  const curTask = chatCurrentTask();
  if (curTask) { // 当前会话生成中 → 视为停止（其他会话的后台任务不受影响）
    curTask.aborted = true;
    if (curTask.abort) curTask.abort.abort();
    return;
  }
  if (CS.rewinding) { toast('正在处理编辑重发，请稍候', 'info'); return; }
  const input = document.getElementById('chatInput');
  const text = (input.value || '').trim();
  if (!text && !CS.pending.length) return;
  const atts = CS.pending.slice();
  CS.pending = [];
  if (input) { input.value = ''; autoResizeInput(); }
  chatRenderChips();
  await chatDispatch(text, atts);
}

/* 统一出包：发消息 + 流式回复（输入框发送 / rewind 编辑重发共用） */
async function chatDispatch(text, atts) {
  atts = atts || [];
  if (!CS.cfg.model) { chatTogglePillPop(true); toast('请先选择模型', 'error'); return; }

  // 确保会话存在（首条消息时才真正建会话，避免空会话堆积）
  if (!CS.sid) {
    try {
      const s = await api('/chat/sessions', { method: 'POST', body: JSON.stringify({ title: '新对话' }) });
      CS.sid = s.id;
      CS.sessions.unshift(s);
    } catch (e) { toast('创建会话失败：' + e.message, 'error'); return; }
  }
  const sid0 = CS.sid; // 本次任务归属的会话：中途切换会话/开新对话后，回写仍落在原会话

  const userMsg = { uid: 'u' + (++CS.seq), role: 'user', content: text, attachments: atts, reasoning: '' };
  CS.msgs.push(userMsg);
  chatAppendRow(buildUserRow(userMsg));

  // 持久化用户消息（附件含 dataURL）
  api('/chat/sessions/' + sid0 + '/messages', {
    method: 'POST',
    body: JSON.stringify({ role: 'user', content: userMsg.content, attachments: userMsg.attachments }),
  }).then(() => chatLoadSessions()).catch(e => toast('消息保存失败：' + e.message, 'error'));

  // 助手消息占位 + 启动任务
  const aMsg = { uid: 'a' + (++CS.seq), role: 'assistant', content: '', reasoning: '', attachments: [], model: chatModelDisplayName(), reasoningSecs: 0, _reasoningDone: false };
  CS.msgs.push(aMsg);
  const row = buildAssistantRow(aMsg, { streaming: true });
  chatAppendRow(row, true);

  await chatRunAssistant(aMsg, sid0);
}

function chatCurrentTask() { return CS.tasks.find(t => t.sid === CS.sid && !t.done); }

function chatUpdateSendBtn() {
  const btn = document.getElementById('chatSendBtn');
  if (!btn) return;
  const busyHere = !!chatCurrentTask(); // 只反映当前会话的生成状态
  btn.classList.toggle('stop', busyHere);
  btn.title = busyHere ? '停止生成' : '发送';
  btn.innerHTML = busyHere ? CHAT_ICONS.stop : CHAT_ICONS.up;
}

function chatAppendRow(row, forceScroll) {
  const box = chatUx();
  if (!box) return;
  let inner = box.querySelector('.chat-msgs-inner');
  if (!inner) {
    box.innerHTML = '';
    inner = document.createElement('div');
    inner.className = 'chat-msgs-inner';
    box.appendChild(inner);
  }
  inner.appendChild(row);
  chatScrollBottom(forceScroll);
}

/* ---------- rewind：用户消息编辑重发 ---------- */
function chatEnterRewindEdit(m) {
  // 一次只允许一个编辑态：先复位已有编辑器
  if (document.querySelector('.rewind-editor')) chatRenderMessages();
  const idx = CS.msgs.indexOf(m);
  if (idx < 0) return;
  const old = document.getElementById('row-' + m.uid);
  if (!old) { chatRenderMessages(); return; }
  old.replaceWith(buildUserRow(m, { editing: true }));
  const ta = document.getElementById('rewind-ta-' + m.uid);
  if (ta) {
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; });
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.scrollTop = ta.scrollHeight;
  }
}

async function chatConfirmRewind(m) {
  if (CS.rewinding) return;
  const ta = document.getElementById('rewind-ta-' + m.uid);
  const newText = ta ? ta.value.trim() : '';
  if (!newText) { toast('内容不能为空', 'error'); return; }
  const idx = CS.msgs.indexOf(m);
  if (idx < 0 || !CS.sid) { chatRenderMessages(); return; }
  CS.rewinding = true;
  try {
    // 若该会话仍有生成任务，先停止并等它完全收尾（其部分内容会先落库，随后被截断一起清掉）
    const cur = chatCurrentTask();
    if (cur && cur.abort) cur.abort.abort();
    const t0 = Date.now();
    while (chatCurrentTask() && Date.now() - t0 < 3000) {
      await new Promise(r => setTimeout(r, 60));
    }
    if (chatCurrentTask()) { toast('正在停止回复，请稍后再试', 'info'); return; }
    // 服务端截断：保留该消息之前的所有消息
    let kept = -1;
    try {
      const r = await api('/chat/sessions/' + CS.sid + '/truncate', { method: 'POST', body: JSON.stringify({ keep: idx }) });
      kept = r.kept;
    } catch (e) { toast('回退失败：' + e.message, 'error'); return; }
    if (CS.sid && kept >= 0) {
      CS.msgs = CS.msgs.slice(0, idx);
      chatRenderMessages();
      // 编辑的是首条消息且标题是它自动派生的 → 标题同步为新文案（手动改过的标题不动）
      if (idx === 0) {
        const oldDerived = (m.content || '').replace(/\n/g, ' ').trim().substring(0, 30);
        const sess0 = CS.sessions.find(x => x.id === CS.sid);
        if (sess0 && (sess0.title === oldDerived || sess0.title === '新对话')) {
          const newTitle = newText.replace(/\n/g, ' ').trim().substring(0, 30) || '新对话';
          api('/chat/sessions/' + CS.sid, { method: 'PUT', body: JSON.stringify({ title: newTitle }) }).then(() => {
            sess0.title = newTitle;
            const t2 = document.getElementById('chatTopTitle');
            if (t2) t2.textContent = newTitle;
            chatLoadSessions();
          }).catch(() => {});
        }
      }
      // 用编辑后的内容走正常发送链路（复用原消息的附件）
      await chatDispatch(newText, m.attachments || []);
    }
  } finally {
    CS.rewinding = false;
  }
}

async function chatOpenSession(sid) {
  try {
    const msgs = await api('/chat/sessions/' + sid + '/messages');
    CS.sid = sid;
    CS.msgs = msgs.map(m => ({
      uid: 'h' + (++CS.seq), role: m.role, content: m.content || '', reasoning: m.reasoning || '',
      attachments: m.attachments || [], model: m.model || '', created_at: m.created_at,
      reasoningSecs: 0, _reasoningDone: true,
    }));
    // 该会话若仍有后台生成任务，把内存中的半成品消息接回界面（流式更新按 uid 命中重建后的节点）
    const t = CS.tasks.find(x => x.sid === sid && !x.done);
    if (t && !CS.msgs.some(m => m === t.aMsg)) CS.msgs.push(t.aMsg);
    chatRenderMessages();
    chatRenderSessions();
    chatUpdateSendBtn();
    const s = CS.sessions.find(x => x.id === sid);
    const t2 = document.getElementById('chatTopTitle');
    if (t2) t2.textContent = s ? s.title : '';
  } catch (e) { toast('加载会话失败：' + e.message, 'error'); }
}

function autoResizeInput() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
}

  document.getElementById('chatDocBtn').addEventListener('click', () => document.getElementById('chatDocInput').click());
  document.getElementById('chatImgInput').addEventListener('change', function() { chatAddFiles(this.files, 'image'); this.value = ''; });
  document.getElementById('chatDocInput').addEventListener('change', function() { chatAddFiles(this.files, 'doc'); this.value = ''; });
  const input = document.getElementById('chatInput');
  input.addEventListener('input', autoResizeInput);
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); chatSend(); }
  });
  input.addEventListener('paste', chatHandlePaste);

  const inputBox = document.querySelector('.chat-input-box');
  if (inputBox) {
    inputBox.addEventListener('dragover', (ev) => {
      ev.preventDefault();
      inputBox.classList.add('drag-over');
    });
    inputBox.addEventListener('dragleave', (ev) => {
      ev.preventDefault();
      inputBox.classList.remove('drag-over');
    });
    inputBox.addEventListener('drop', (ev) => {
      ev.preventDefault();
      inputBox.classList.remove('drag-over');
      const dt = ev.dataTransfer;
      if (dt && dt.files && dt.files.length) {
        chatAddFiles(Array.from(dt.files), 'auto');
        input.focus();
      }
    });
  }

  document.getElementById('chatSendBtn').addEventListener('click', chatSend);
  // 模型 / 思考强度选择器
  document.getElementById('chatModelPill').addEventListener('click', (ev) => { ev.stopPropagation(); chatTogglePillPop(); });
  document.getElementById('chatPillPop').addEventListener('click', (ev) => {
    ev.stopPropagation(); // 防止重渲染后脱离文档的节点被 document 外点关闭逻辑误判
    // 子面板行（模型 / 推理等级）与返回行：切换面板层级
    const row = ev.target.closest('.pill-pop-row, .pill-pop-back');
    if (row) {
      CS.pillView = row.dataset.view || 'root';
      if (CS.pillView === 'models') chatLoadModels(); // 打开模型列表时刷新一次上游模型（含新增供应商/模型）
      else chatRenderPillPop();
      return;
    }
    // 模型列表：选择后收起（直接使用该上游真实模型，仅影响网页对话）
    const item = ev.target.closest('.pill-pop-item[data-ref]');
    if (item && item.dataset.ref) {
      CS.cfg.model = item.dataset.ref;
      CS.pillView = 'root';
      chatSyncPill(); chatTogglePillPop(false);
      toast('已切换模型：' + (chatModelDisplayName() || CS.cfg.model), 'success');
      return;
    }
    // 推理等级：选择后面板保持打开并更新勾选（图3样式）
    const eff = ev.target.closest('.pill-pop-item[data-effort]');
    if (eff) {
      CS.effort = eff.dataset.effort || 'default';
      chatSyncPill(); chatRenderPillPop();
    }
  });
  if (!window._chatOverlayBound) {
    window._chatOverlayBound = true;
    document.getElementById('overlay').addEventListener('click', () => {
      document.getElementById('chatSide').classList.remove('open');
    });
    document.addEventListener('paste', (ev) => {
      const ci = document.getElementById('chatInput');
      if (!ci) return;
      if (ev.target && ev.target !== ci && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA')) return;
      const cd = ev.clipboardData || window.clipboardData;
      if (!cd) return;
      const hasFiles = (cd.files && cd.files.length > 0) || (cd.items && Array.from(cd.items).some(it => it.kind === 'file'));
      if (hasFiles) {
        chatHandlePaste(ev);
      }
    });
    document.addEventListener('dragover', (ev) => {
      if (document.getElementById('chatInput')) ev.preventDefault();
    });
    document.addEventListener('drop', (ev) => {
      const ci = document.getElementById('chatInput');
      if (ci && !ev.target.closest('.chat-input-box')) {
        ev.preventDefault();
        const dt = ev.dataTransfer;
        if (dt && dt.files && dt.files.length > 0) {
          chatAddFiles(Array.from(dt.files), 'auto');
          ci.focus();
        }
      }
    });
  }

  chatRenderMessages();
  await Promise.all([chatLoadConfig(), chatLoadSessions()]);
};

// v10.0: 桶解冻
})();
</script>
<script>
(function(){
  var btn = document.getElementById('themeToggle');
  if (!btn) return;
  var ICONS = {
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
  };
  function cur(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }
  function paint(){ btn.innerHTML = cur() === 'dark' ? ICONS.light : ICONS.dark; }
  btn.addEventListener('click', function(){
    var n = cur() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    try { localStorage.setItem('masterapi-theme', n); } catch(e) {}
    paint();
  });
  paint();
})();
</script>
