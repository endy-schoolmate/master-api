/* ---- 接入方法（内置供应商目录）：仅预填，手动创建流程不变 ---- */

window._upPresets = null;
window._upPresetsPromise = null;

function _upLoadPresets() {
  if (!window._upPresetsPromise) {
    window._upPresetsPromise = api('/upstreams/presets')
      .then(r => { window._upPresets = Array.isArray(r && r.presets) ? r.presets : []; })
      .catch(() => { window._upPresets = []; });
  }
  return window._upPresetsPromise;
}

// 按 group 分组渲染 optgroup；只追加，不影响占位项
function _upRenderPresetOptions(selId) {
  const sel = document.getElementById(selId);
  if (!sel || !window._upPresets) return;
  const groups = [];
  window._upPresets.forEach(p => {
    let g = groups.find(x => x.name === (p.group || '其他'));
    if (!g) { g = { name: p.group || '其他', items: [] }; groups.push(g); }
    g.items.push(p);
  });
  groups.forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g.name;
    g.items.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
}

// 选中一家内置供应商：自动预填 名称/Base URL/API 格式/Provider 标识，全部仍可手改
window.upApplyPreset = function() {
  const sel = document.getElementById('up_preset');
  if (!sel) return;
  const p = (window._upPresets || []).find(x => x.id === sel.value);
  if (!p) { if (hint) hint.style.display = 'none'; return; }

  document.getElementById('up_name').value = p.name || '';
  document.getElementById('up_baseurl').value = p.base_url || '';
  const fmtSel = document.getElementById('up_format');
  if (fmtSel && Array.from(fmtSel.options).some(o => o.value === p.api_format)) fmtSel.value = p.api_format;

  // Provider 标识必须唯一：被占用时自动加 -2、-3… 后缀
  const ctx = window._upCtx || {};
  const taken = new Set((window._upstreamList || [])
    .filter(u => !(ctx.k && String(u.id) === String(ctx.k.id)))
    .map(u => u.provider));
  let pid = p.id, i = 2;
  while (taken.has(pid)) { pid = p.id + '-' + i; i++; }
  document.getElementById('up_provider').value = pid;

  // 账号登录类预设：显示 OAuth 向导并预填默认模型；普通预设恢复手动 Key 流程
  const isOauthPreset = p.auth_method === 'oauth_login';
  const oauthPanel = document.getElementById('up_oauth_panel');
  window._upOAuthStateId = null;
  window._upOAuthPreset = isOauthPreset ? p : null;
  if (oauthPanel) oauthPanel.style.display = window._upOAuthPreset ? 'block' : 'none';
  if (window._upOAuthPreset) {
    const st = document.getElementById('up_oauth_status');
    if (st) { st.textContent = '未登录'; st.style.color = 'var(--text-sec)'; }
    const pr = document.getElementById('up_oauth_paste_row');
    if (pr) pr.style.display = 'none';
    // 预填默认模型并全选（之后仍可增删）
    const defaults = Array.isArray(p.default_models) ? p.default_models.slice() : [];
    if (defaults.length) {
      window._upSelectedModels = new Set(defaults);
      window._upAvailableModels = defaults.slice();
      window._upManualModels = new Set();
      _upRenderModelCheckboxes(defaults);
      const fb = document.getElementById('up_fetch_btn');
      if (fb) fb.textContent = '重新拉取';
    }
  }
  const keyInput = document.getElementById('up_apikey');
  if (keyInput) keyInput.focus();
};

/* ---- ChatGPT 账号登录（Sign in with ChatGPT OAuth 流程） ---- */

window._upOAuthStateId = null;
window._upOAuthTimer = null;

window.upOAuthStart = async function() {
  const btn = document.getElementById('up_oauth_start_btn');
  const st = document.getElementById('up_oauth_status');
  const pr = document.getElementById('up_oauth_paste_row');
  if (!btn || !st) return;
  btn.disabled = true; btn.textContent = '发起中…';
  st.textContent = '正在生成登录会话…'; st.style.color = 'var(--text-sec)';
  try {
    const r = await api('/upstreams/oauth/start', { method: 'POST', body: JSON.stringify({}) });
    window._upOAuthStateId = r.state_id;
    st.textContent = '已打开授权页，请在浏览器完成 ChatGPT 登录…';
    st.style.color = 'var(--warning)';
    const win = window.open(r.login_url, '_blank');
    if (!win) {
      // 弹窗被拦截：给一个可点击的链接
      st.innerHTML = '浏览器拦截了弹窗，<a href="' + escapeHtml(r.login_url) + '" target="_blank">点此打开授权页</a>（Sign in with ChatGPT）';
      st.style.color = 'var(--warning)';
    }
    if (!r.callback_ok && pr) {
      // 仅当本机 1455 回调端口被占用（自动跳转回不来）时才需要手动粘贴
      pr.style.display = 'flex';
      if (st) st.innerHTML += '<br>本机 1455 回调端口被占用，将在浏览器登录后<strong>手动粘贴回调 URL</strong>完成。';
    } else if (pr) {
      pr.style.display = 'none';
    }    if (window._upOAuthTimer) clearInterval(window._upOAuthTimer);
    const startedAt = Date.now();
    window._upOAuthTimer = setInterval(async () => {
      if (!window._upOAuthStateId) { clearInterval(window._upOAuthTimer); return; }
      // 轮询 5 分钟后停止
      if (Date.now() - startedAt > 5 * 60 * 1000) {
        clearInterval(window._upOAuthTimer);
        st.textContent = '等待登录超时，可重新发起'; st.style.color = 'var(--danger)';
        btn.disabled = false; btn.textContent = '重新发起登录';
        return;
      }
      try {
        const s = await api('/upstreams/oauth/status/' + window._upOAuthStateId);
        if (s.status === 'completed') {
          clearInterval(window._upOAuthTimer);
          st.textContent = '✓ ChatGPT 账号已连接，可直接保存';
          st.style.color = 'var(--success)';
          btn.disabled = false; btn.textContent = '重新登录';
        } else if (s.status === 'failed') {
          clearInterval(window._upOAuthTimer);
          st.textContent = '✗ 登录失败：' + (s.error || '未知错误');
          st.style.color = 'var(--danger)';
          btn.disabled = false; btn.textContent = '重新发起登录';
        }
      } catch (e) { /* 网络抖动时继续轮询 */ }
    }, 2500);
  } catch (e) {
    st.textContent = '✗ ' + e.message; st.style.color = 'var(--danger)';
  }
  btn.disabled = false; btn.textContent = '重新发起登录';
};

window.upOAuthPaste = async function() {
  const inp = document.getElementById('up_oauth_paste_input');
  const st = document.getElementById('up_oauth_status');
  const url = (inp.value || '').trim();
  if (!url || !window._upOAuthStateId) { toast('请先发起登录，再粘贴回调 URL', 'error'); return; }
  try {
    const s = await api('/upstreams/oauth/paste', {
      method: 'POST',
      body: JSON.stringify({ state_id: window._upOAuthStateId, url })
    });
    if (s.status === 'completed') {
      st.textContent = '✓ ChatGPT 账号已连接，可直接保存';
      st.style.color = 'var(--success)';
      if (window._upOAuthTimer) clearInterval(window._upOAuthTimer);
      toast('ChatGPT 登录完成', 'success');
    } else {
      st.textContent = '✗ ' + (s.error || '状态：' + s.status);
      st.style.color = 'var(--danger)';
    }
  } catch (e) {
    st.textContent = '✗ ' + e.message; st.style.color = 'var(--danger)';
  }
};

          '<button type="button" class="btn btn-sm" id="up_fetch_btn" onclick="upFetchModels()">从上游拉取模型</button>' +

        '</div>' +
        '<div id="up_manual_row" style="display:none;gap:8px;margin-bottom:8px">' +
          '<input id="up_manual_input" placeholder="输入模型 ID，如 gpt-4o-mini、claude-sonnet-4" style="flex:1">' +
          '<button type="button" class="btn btn-sm btn-primary" onclick="upAddManualModel()">添加</button>' +
        '</div>' +
        '<div id="up_models_panel" style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px;min-height:60px">' +
          '<div class="text-sec" style="font-size:12px">点击「从上游拉取模型」在线获取，或点「手动添加模型」直接输入模型 ID</div>' +
        '</div>' +
      '</div>' +
      '<details class="up-advanced"><summary>高级设置（调度参数）</summary>' +

        '<div class="form-group"><label>RPM 限制</label><input id="up_rpm" type="number" value="' + (k.rpm_limit ?? 60) + '"></div>' +
        '<div class="form-group"><label>切换阈值</label><input id="up_switch" type="number" value="' + (k.switch_threshold ?? 3) + '"></div>' +
      '</details>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn" type="button" id="up_test_btn">测试连通性</button>' +
      '<span id="up_test_result" class="up-test-result"></span>' +
      '<div style="flex:1"></div>' +
      '<button class="btn" onclick="closeModal()">取消</button>' +
      '<button class="btn btn-primary" id="up_save_btn">' + (isEdit ? '保存修改' : '添加供应商') + '</button>' +
    '</div>';

  showModal(html, true);

  // 初始化已选模型集合
  window._upSelectedModels = new Set();
  window._upAvailableModels = [];
  window._upManualModels = new Set();

  // 添加时加载内置供应商目录填充"接入方法"下拉（缓存，仅首个弹窗请求一次）
  if (!isEdit) {
    _upLoadPresets().then(() => _upRenderPresetOptions('up_preset'));
  }
  const models = Array.isArray(k._models) ? k._models : [];
  if (models.length) {
    // 已有保存的模型：预先勾选，并直接渲染 checkbox 列表（无需再拉取）
    const ids = models.map(m => typeof m === 'string' ? m : m.id).filter(Boolean);
    ids.forEach(id => window._upSelectedModels.add(id));
    window._upAvailableModels = ids;
    _upRenderModelCheckboxes(ids);
    document.getElementById('up_fetch_btn').textContent = '重新拉取';
  }

  // 手动添加输入行：回车即添加
  const manualInput = document.getElementById('up_manual_input');
  if (manualInput) {
    manualInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); window.upAddManualModel(); }
    });
  }

  function readForm() {
    const fmt = document.getElementById('up_format').value;
    const providerOverride = (document.getElementById('up_provider').value || '').trim();
    return {
      name: (document.getElementById('up_name').value || '').trim(),
      base_url: (document.getElementById('up_baseurl').value || '').trim().replace(/\/+$/, ''),
      api_key: (document.getElementById('up_apikey').value || '').replace(/\s+/g, ''),
      provider: providerOverride || fmt,
      weight: parseInt(document.getElementById('up_weight').value) || 1,
      rpm_limit: parseInt(document.getElementById('up_rpm').value) || 60,
      switch_threshold: parseInt(document.getElementById('up_switch').value) || 3,
      models: _upCollectModels(),
      oauth_state_id: window._upOAuthStateId || null
    };
  }

  // 测试连通性：逐个测试已选模型
  document.getElementById('up_test_btn').addEventListener('click', async function() {
    const f = readForm();
    const resEl = document.getElementById('up_test_result');
    resEl.className = 'up-test-result';
    resEl.innerHTML = '';
    if (!f.base_url) { toast('请先填写 Base URL', 'error'); return; }
    if (!isEdit && !f.api_key && !f.oauth_state_id) { toast('新建时请填写 API Key 后再测试', 'error'); return; }
    if (f.models.length === 0) { toast('请先勾选或手动添加至少一个模型', 'error'); return; }

    this.disabled = true;
    const orig = this.textContent;
    this.textContent = '测试中...';
    resEl.style.display = 'block';

    // 每个模型渲染一行结果
    const statusMap = {};
    f.models.forEach(mid => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;';
      row.innerHTML = '<span style="flex:1;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px" title="' + escapeHtml(mid) + '">' + escapeHtml(mid) + '</span>'
        + '<span style="color:var(--text-sec);white-space:nowrap">等待中…</span>';
      resEl.appendChild(row);
      statusMap[mid] = row.querySelector('span:last-child');
    });

    let passCount = 0;
    for (const mid of f.models) {
      const statusEl = statusMap[mid];
      statusEl.textContent = '测试中…';
      try {
        let r;
        if (isEdit) {
          r = await api('/upstreams/' + k.id + '/test', {
            method: 'POST',
            body: JSON.stringify({ base_url: f.base_url, api_key: f.api_key || null, provider: f.provider, model: mid })
          });
        } else {
          r = await api('/upstreams/test', {
            method: 'POST',
            body: JSON.stringify({ base_url: f.base_url, api_key: f.api_key, provider: f.provider, model: mid })
          });
        }
        if (r.ok) {
          passCount++;
          statusEl.style.color = 'var(--success)';
          statusEl.textContent = '✓ 正常' + (r.latency_ms != null ? ' ' + r.latency_ms + 'ms' : '');
        } else {
          statusEl.style.color = 'var(--danger)';
          statusEl.textContent = '✗ ' + (r.error || 'HTTP ' + (r.http_status || '?'));
        }
      } catch(e) {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = '✗ ' + e.message;
      }
    }

    this.disabled = false;
    this.textContent = orig;
    if (isEdit) R.keys();
    toast(passCount + ' / ' + f.models.length + ' 个模型测试通过', passCount === f.models.length ? 'success' : 'error');
  });

  // 保存
  document.getElementById('up_save_btn').addEventListener('click', async function() {
    const f = readForm();
    if (!f.name) { toast('请填写名称', 'error'); return; }
    if (!f.base_url) { toast('请填写 Base URL', 'error'); return; }
    if (!f.provider) { toast('请填写 Provider 标识', 'error'); return; }
    if (f.models.length === 0) { toast('请先勾选或手动添加至少一个模型', 'error'); return; }

    // 唯一性校验：从当前列表里找有没有其他供应商用了同一个 provider
    const errEl = document.getElementById('up_provider_err');
    const dupKey = (window._upstreamList || []).find(u =>
      u.provider === f.provider && String(u.id) !== String(k.id)
    );
    if (dupKey) {
      errEl.textContent = '与「' + escapeHtml(dupKey.name) + '」的 Provider 标识重复，请修改';
      errEl.style.display = '';
      return;
    }
    errEl.style.display = 'none';

    this.disabled = true;
    try {
      if (isEdit) {
        const putBody = {
          name: f.name, base_url: f.base_url, provider: f.provider,
          weight: f.weight, rpm_limit: f.rpm_limit, switch_threshold: f.switch_threshold
        };
        // 填了新 Key 才替换（留空表示不修改现有密钥）
        if (f.api_key) putBody.api_key = f.api_key;
        await api('/upstreams/' + k.id, {
          method: 'PUT',
          body: JSON.stringify(putBody)
        });
        // 模型清单单独保存（同步 model_to_provider 映射）
        await api('/upstreams/' + k.id + '/models', {
          method: 'POST', body: JSON.stringify({ models: f.models })
        });
        closeModal(); toast('已保存', 'success'); R.keys();
        // 保存后自动补一次连通性检测，让列表立即显示最新状态而不是"未检测"
        api('/upstreams/' + k.id + '/test', { method: 'POST', body: JSON.stringify({}) })
          .then(() => R.keys()).catch(() => {});
      } else {
        const isOAuth = f.provider === 'openai-codex' || f.oauth_state_id;
        if (isOAuth && !f.oauth_state_id) {
          toast('请先点击「发起浏览器登录」完成 ChatGPT 授权', 'error'); this.disabled = false; return;
        }
        if (!isOAuth && !f.api_key) { toast('请填写 API Key', 'error'); this.disabled = false; return; }
        const postBody = {
          name: f.name, provider: f.provider, base_url: f.base_url,
          weight: f.weight, rpm_limit: f.rpm_limit, switch_threshold: f.switch_threshold,
          models: f.models
        };
        if (isOAuth) {
          postBody.auth_type = 'oauth';
          postBody.oauth_state_id = f.oauth_state_id;
        } else {
          postBody.api_key = f.api_key;
        }
        const created = await api('/upstreams', {
          method: 'POST',
          body: JSON.stringify(postBody)
        });
        window._upOAuthStateId = null;
        closeModal(); toast('供应商已添加', 'success'); R.keys();
        // 新建后自动用已保存的配置探测一次，状态直接显示为检测结果
        if (created && created.id) {
          api('/upstreams/' + created.id + '/test', { method: 'POST', body: JSON.stringify({}) })
            .then(() => R.keys()).catch(() => {});
        }
      }
    } catch(e) { toast(e.message, 'error'); this.disabled = false; }
  });
}

function editKey(id, list) {

R.vmodels = async function() {
  const c = gc();
  c.innerHTML = spinner();
  const ha = document.getElementById('headerActions');
  ha.innerHTML = '<button class="btn btn-primary btn-sm" id="createVmBtn">+ 创建聚合模型</button>';
  try {
    const data = await api('/virtual-models');
    const list = (data && data.virtual_models) || [];
    c.innerHTML = '';

    // 说明卡片
    const intro = document.createElement('div');
    intro.className = 'card';
    intro.style.marginBottom = '12px';
    intro.innerHTML = '<div style="font-size:13px;line-height:1.8;color:var(--text-sec)">'
      + '把多个真实模型包装成一个<strong style="color:var(--text)">虚拟模型 ID</strong>。'
      + 'Agent 只需在 Base URL / API Key 之外填这个虚拟 ID，网关会<strong style="color:var(--text)">按链顺序</strong>调用真实模型；'
      + '某个模型不可用或持续限速时<strong style="color:var(--text)">自动无缝切换</strong>到下一个。'
      + '<br>Base URL：<code>http://127.0.0.1:8000/v1</code>　·　容错：单模型内换 key 重试，'
      + '60s 内失败达 3 次则软熔断该模型 90s（期间自动跳过）。</div>';
    c.appendChild(intro);

    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'card text-sec';
      empty.textContent = '暂无聚合模型，点击右上角「创建聚合模型」开始配置。';
      c.appendChild(empty);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      let html = '<table><thead><tr><th>虚拟模型 ID</th><th>显示名</th><th>当前使用模型</th><th>状态</th><th>操作</th></tr></thead><tbody>';
      list.forEach(v => {
        const chain = v.chain || [];
        const cd = v.cooldowns || {};
        // 只显示当前使用的模型：链中第一个未软熔断的；全部熔断时显示第一个并标熔断
        const cur = chain.find(m => !(cd[m] > 0)) || chain[0] || '';
        const rem = cd[cur] || 0;
        const label = cur.includes('::') ? cur.split('::').slice(1).join('::') + ' · ' + cur.split('::')[0] : cur;
        let curHtml = '<span class="text-dim">空</span>';
        if (cur) {
          if (rem > 0) curHtml = '<span class="badge badge-yellow" title="软熔断中，剩余' + Math.round(rem) + 's">' + escapeHtml(label) + ' ⏳' + Math.round(rem) + 's</span>';
          else curHtml = '<span class="badge badge-green">' + escapeHtml(label) + '</span>';
        }
        const spare = chain.length > 1 ? ' <span class="text-dim" style="font-size:11px">+' + (chain.length - 1) + ' 备用</span>' : '';
        const st = v.enabled === false ? badge('已停用', 'red') : badge('启用中', 'green');
        html += '<tr><td><code>' + escapeHtml(v.id) + '</code></td><td>' + escapeHtml(v.display_name || '-') + '</td><td>' + curHtml + spare + '</td><td>' + st + '</td><td class="flex gap-8">';
        html += '<button class="btn btn-sm" data-id="' + escapeHtml(v.id) + '" data-action="edit">编辑</button>';
        html += '<button class="btn btn-sm btn-danger" data-id="' + escapeHtml(v.id) + '" data-action="delete">删除</button>';
        html += '</td></tr>';
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
      c.appendChild(wrap);

      c.querySelectorAll('[data-action="edit"]').forEach(b => b.addEventListener('click', function() {
        const v = list.find(x => x.id === this.dataset.id);
        vmodelFormModal('edit', v);
      }));
      c.querySelectorAll('[data-action="delete"]').forEach(b => b.addEventListener('click', function() { deleteVmodel(this.dataset.id); }));
    }

    document.getElementById('createVmBtn').addEventListener('click', function() { vmodelFormModal('create', null); });
  } catch(e) {
    c.innerHTML = '<div class="card text-sec">加载失败: ' + e.message + '</div>';
  }
};

// 可用真实模型缓存（表单打开时从 /available-models 拉取）
window._vmAvailModels = [];

// 构造一行的模型下拉选项 HTML；selected 为当前选中的模型 ID
function _vmModelOptions(selected) {
  const avail = window._vmAvailModels || [];
  const nameCount = {};
  avail.forEach(m => { const mid = m.model_id || m.id; nameCount[mid] = (nameCount[mid] || 0) + 1; });
  let opts = '<option value="">— 选择模型 —</option>';
  avail.forEach(m => {
    const providers = Array.isArray(m.active_providers) ? m.active_providers :
      (Array.isArray(m.providers) ? m.providers : (m.provider ? [m.provider] : []));
    const mid = m.model_id || m.id;
    // 供应商名默认展示在行尾的圆角徽标里；同名模型有多个供应商时才在下拉里带后缀以区分
    const label = mid + ((nameCount[mid] > 1 && providers.length) ? ' · ' + providers.join(', ') : '');
    opts += '<option value="' + escapeHtml(m.id) + '"' + (m.id === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
  });
  if (selected && !avail.some(m => m.id === selected)) {
    opts += '<option value="' + escapeHtml(selected) + '" selected>' + escapeHtml(selected) + '（已配置，当前不在可用列表）</option>';
  }
  return opts;
}

// 模型链行的增删（挂 window 供 onclick 调用）；改为下拉选择已配置的真实模型
window.vmAddChainRow = function(model) {
  const box = document.getElementById('vm_chain');
  if (!box) return;
  const empty = document.getElementById('vm_chain_empty');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'vm-chain-row';
  row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px';
  const sel = document.createElement('select');
  sel.className = 'vm-chain-input';
  sel.style.flex = '1';
  sel.style.maxWidth = '460px';
  sel.innerHTML = _vmModelOptions(model || '');
  const up = document.createElement('button');
  up.className = 'btn btn-sm'; up.type = 'button'; up.textContent = '↑';
  up.title = '上移（优先级更高）';
  up.addEventListener('click', function() { const p = row.previousElementSibling; if (p && p.classList.contains('vm-chain-row')) row.parentNode.insertBefore(row, p); });
  const down = document.createElement('button');
  down.className = 'btn btn-sm'; down.type = 'button'; down.textContent = '↓';
  down.title = '下移';
  down.addEventListener('click', function() { const n = row.nextElementSibling; if (n && n.classList.contains('vm-chain-row')) row.parentNode.insertBefore(n, row); });
  const del = document.createElement('button');
  del.className = 'btn btn-sm btn-danger'; del.type = 'button'; del.textContent = '删除';
  del.addEventListener('click', function() { row.remove(); });
  // 供应商徽标：与模型下拉同行对齐，随选择实时更新
  const prov = document.createElement('span');
  prov.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;min-width:76px;max-width:200px;padding:4px 12px;border:1px solid var(--border-strong);border-radius:10px;font-size:12px;font-weight:500;color:var(--text-sec);background:var(--bg-card-2);white-space:nowrap;overflow:hidden';
  const syncProv = function() {
    const cur = (window._vmAvailModels || []).find(m => m.id === sel.value);
    let name = cur ? (cur.provider || (cur.providers || [])[0] || (cur.active_providers || [])[0] || '') : '';
    if (!name && sel.value && sel.value.indexOf('::') > 0) name = sel.value.split('::')[0];
    prov.textContent = name || '—';
  };
  sel.addEventListener('change', syncProv);
  row.appendChild(sel); row.appendChild(up); row.appendChild(down); row.appendChild(del); row.appendChild(prov);
  syncProv();
  box.appendChild(row);
};

function _vmCollectChain() {
  const rows = document.querySelectorAll('#vm_chain .vm-chain-row');
  const out = [];
  rows.forEach(r => { const v = (r.querySelector('.vm-chain-input').value || '').trim(); if (v) out.push(v); });
  return out;
}

// 测试整条链的连通性（挂 window 供按钮调用）
window.vmTestChain = async function() {
  const chainArr = _vmCollectChain();
  const resEl = document.getElementById('vm_test_result');
  const btn = document.getElementById('vm_test_btn');
  if (!chainArr.length) { toast('请先在模型链里选择至少一个模型', 'error'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '测试中...'; }
  if (resEl) resEl.innerHTML = '';
  try {
    const r = await api('/virtual-models/test', { method: 'POST', body: JSON.stringify({ chain: chainArr }) });
    const rows = (r.results || []).map(x => {
      const dot = x.ok ? '<span style="color:var(--success)">●</span>' : '<span style="color:var(--danger)">●</span>';
      const msg = x.ok ? '连通正常' : (x.message || x.reason || '失败');
      return '<div style="display:flex;gap:8px;align-items:center;padding:2px 0"><span>' + dot + '</span><code style="flex:0 0 auto">' + escapeHtml(x.model) + '</code><span class="text-sec" style="font-size:12px">' + escapeHtml(msg) + '</span></div>';
    }).join('');
    if (resEl) resEl.innerHTML = '<div style="margin-top:8px;padding:8px;background:var(--bg-surface);border-radius:var(--radius-sm)"><div class="text-sec" style="font-size:12px;margin-bottom:4px">连通 ' + (r.ok_count||0) + '/' + (r.total||0) + '：</div>' + rows + '</div>';
  } catch(e) {
    if (resEl) resEl.innerHTML = '<div class="text-sec" style="color:var(--danger);margin-top:8px;font-size:12px">测试失败：' + escapeHtml(e.message) + '</div>';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '测试连通性'; }
  }
};

// mode: 'create' | 'edit'
async function vmodelFormModal(mode, v) {
  v = v || {};
  const isEdit = mode === 'edit';
  const title = isEdit ? '编辑聚合模型' : '创建聚合模型';
  const idField = '<input id="vm_id" placeholder="自定义虚拟模型 ID，如 my-super-model" value="' + escapeHtml(v.id || '') + '">';
  const enabledChecked = (v.enabled === false) ? '' : ' checked';

  // 先拉取已配置的真实模型，供模型链下拉选择
  try {
    const am = await api('/available-models');
    window._vmAvailModels = (am && am.models) || [];
  } catch(e) {
    window._vmAvailModels = [];
  }
  const hasAvail = (window._vmAvailModels || []).length > 0;
  const chainHint = hasAvail
    ? '从已配置的真实模型里选择，按顺序做故障转移（越靠前优先级越高）。'
    : '还没有可选模型。请先到「上游密钥」里给供应商配置模型清单。';

  const html =
    '<div class="modal-header"><h3>' + title + '</h3><button class="modal-close" onclick="closeModal()">x</button></div>' +
    '<div class="modal-body">' +
      '<p class="text-sec" style="margin:-6px 0 14px;font-size:12px">Agent 里填这个虚拟 ID，网关按下面的顺序做故障转移。</p>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">' +
        '<div class="form-group"><label>虚拟模型 ID</label>' + idField + (isEdit ? '<div class="text-sec" style="font-size:12px;margin-top:4px">可修改；改后客户端需改用新 ID 调用</div>' : '') + '</div>' +
        '<div class="form-group"><label>显示名（可选）</label><input id="vm_dname" placeholder="如：我的聚合模型" value="' + escapeHtml(v.display_name || '') + '"></div>' +
      '</div>' +
      '<div class="form-group"><label>模型链（按顺序，越靠前优先级越高）</label>' +
        '<div class="text-sec" style="font-size:12px;margin-bottom:6px">' + chainHint + '</div>' +
        '<div id="vm_chain"></div>' +
        '<button type="button" class="btn btn-sm" style="margin-top:6px"' + (hasAvail ? '' : ' disabled') + ' onclick="vmAddChainRow()">+ 添加模型</button>' +
        '<div id="vm_test_result"></div></div>' +
      '<div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="vm_enabled" style="width:auto"' + enabledChecked + '> 启用</label></div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn" type="button" id="vm_test_btn" onclick="vmTestChain()">测试连通性</button>' +
      '<div style="flex:1"></div>' +
      '<button class="btn" onclick="closeModal()">取消</button>' +
      '<button class="btn btn-primary" id="vm_save_btn">' + (isEdit ? '保存修改' : '创建') + '</button>' +
    '</div>';

  showModal(html, true);

  // 预填模型链
  const chain = Array.isArray(v.chain) ? v.chain : [];
  if (chain.length) {
    chain.forEach(m => window.vmAddChainRow(m));
  } else {
    document.getElementById('vm_chain').innerHTML = '<div class="text-sec" id="vm_chain_empty" style="font-size:12px;padding:4px 0">尚未添加模型</div>';
  }

  document.getElementById('vm_save_btn').addEventListener('click', async function() {
    const vid = (document.getElementById('vm_id').value || '').trim();
    const dname = (document.getElementById('vm_dname').value || '').trim();
    const enabled = document.getElementById('vm_enabled').checked;
    const chainArr = _vmCollectChain();
    if (!vid) { toast('请填写虚拟模型 ID', 'error'); return; }
    if (!chainArr.length) { toast('模型链至少需要一个真实模型', 'error'); return; }
    this.disabled = true;
    try {
      if (isEdit) {
        const body = { display_name: dname, chain: chainArr, enabled: enabled };
        if (vid && vid !== (v.id || '')) body.new_id = vid;
        await api('/virtual-models/' + encodeURIComponent(v.id || vid), {
          method: 'PUT',
          body: JSON.stringify(body)
        });
        closeModal(); toast(vid !== (v.id || '') ? '已保存，模型 ID 已改为 ' + vid : '已保存', 'success'); R.vmodels();
      } else {
        await api('/virtual-models', {
          method: 'POST',
          body: JSON.stringify({ id: vid, display_name: dname, chain: chainArr, enabled: enabled })
        });
        closeModal(); toast('聚合模型已创建', 'success'); R.vmodels();
      }
    } catch(e) { toast(e.message, 'error'); this.disabled = false; }
  });
}

// 测试当前聚合链里每个真实模型的连通性
window.vmTestChain = async function() {
  const chainArr = _vmCollectChain();
  const resEl = document.getElementById('vm_test_result');
  const btn = document.getElementById('vm_test_btn');
  if (!chainArr.length) { toast('请先添加至少一个模型', 'error'); return; }
  if (!resEl) return;
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '测试中...';
  resEl.innerHTML = '<div class="text-sec" style="font-size:12px;margin-top:8px">正在逐个探测...</div>';
  try {
    const r = await api('/virtual-models/test', {
      method: 'POST',
      body: JSON.stringify({ chain: chainArr })
    });
    const rows = (r.results || []).map(function(x) {
      const ok = x.ok;
      const color = ok ? 'var(--success)' : 'var(--danger)';
      const icon = ok ? '✓' : '✗';
      const msg = escapeHtml(x.message || (ok ? '连通正常' : '失败'));
      const providers = Array.isArray(x.providers) ? x.providers.join(', ') : (x.provider || '?');
      return '<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px">'
        + '<span style="color:' + color + ';font-weight:700">' + icon + '</span>'
        + '<code>' + escapeHtml(x.model) + '</code>'
        + '<span class="text-dim">(' + escapeHtml(providers) + ')</span>'
        + '<span style="color:' + color + '">' + msg + '</span></div>';
    }).join('');
    resEl.innerHTML = '<div style="margin-top:8px;padding:8px 10px;background:var(--bg-surface);border-radius:var(--radius-sm)">'
      + '<div style="font-size:12px;margin-bottom:4px;color:var(--text-sec)">连通 ' + (r.ok_count || 0) + '/' + (r.total || 0) + '：</div>'
      + rows + '</div>';
  } catch(e) {
    resEl.innerHTML = '<div style="color:var(--danger);font-size:12px;margin-top:8px">测试失败：' + escapeHtml(e.message) + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
};

/* ---- 代理设置（网关出站代理，作用于 OpenAI 直连类流量） ---- */
R.proxy = async function() {
  const c = gc();
  document.getElementById('headerActions').innerHTML = '';
  c.innerHTML = spinner();
  let info = { setting: '', env: '', effective: '', source: 'none', mode: 'none' };
  try { info = await api('/proxy'); } catch (e) {}
  const eff = info.effective || '';

  c.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="section-title">出站代理</div>' +
    '<div class="text-sec" style="font-size:12px;margin:-6px 0 16px">为网关访问 OpenAI 官方接口配置统一出站代理；国内中转类上游不受影响。保存后即时生效，无需重启。</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">' +
      '<label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px"><input type="radio" name="px_mode" value="none"' + (!eff ? ' checked' : '') + ' style="accent-color:var(--primary);width:15px;height:15px"> 不使用代理（直连）</label>' +
      '<label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px"><input type="radio" name="px_mode" value="manual"' + (eff ? ' checked' : '') + ' style="accent-color:var(--primary);width:15px;height:15px"> 使用代理</label>' +
    '</div>' +
    '<div class="form-group"><label>代理地址</label><input id="px_url" placeholder="http://127.0.0.1:10808 或 socks5://127.0.0.1:10808" value="' + escapeHtml(info.setting || (info.mode === 'manual' ? info.effective : '')) + '"></div>' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 14px">' +
      '<button type="button" class="btn btn-sm" id="px_test_btn">测试连通</button>' +
      '<span id="px_test_result" class="text-sec" style="font-size:12px"></span>' +
    '</div>' +
    '<div class="text-sec" style="font-size:12px;line-height:1.7;margin-bottom:14px">当前生效：<b>' + (eff ? escapeHtml(eff) : '直连（未配置）') + '</b>' +
      (info.source === 'env' ? '（来自环境变量 MASTER_API_OAUTH_PROXY；在此保存控制台配置后将以本页配置为准）' : '') + '</div>' +
    '<button type="button" class="btn btn-primary btn-sm" id="px_save_btn">保存</button>';
  c.appendChild(card);

  const radios = card.querySelectorAll('input[name="px_mode"]');
  const urlInput = card.querySelector('#px_url');
  function syncMode() {
    const manual = card.querySelector('input[name="px_mode"]:checked').value === 'manual';
    urlInput.disabled = !manual;
    urlInput.style.opacity = manual ? '' : '.5';
  }
  radios.forEach(r => r.addEventListener('change', syncMode));
  syncMode();

  card.querySelector('#px_test_btn').addEventListener('click', async function() {
    const manual = card.querySelector('input[name="px_mode"]:checked').value === 'manual';
    const resEl = card.querySelector('#px_test_result');
    this.disabled = true; this.textContent = '测试中…';
    resEl.textContent = '请求中…';
    try {
      const r = await api('/proxy/test', { method: 'POST', body: JSON.stringify({ url: manual ? urlInput.value.trim() : '' }) });
      if (r.ok) {
        resEl.innerHTML = '<span style="color:var(--success)">✓ 连通正常 · 出口 IP: ' + escapeHtml(r.ip) + ' · ' + r.latency_ms + 'ms · ' + escapeHtml(r.proxy) + '</span>';
      } else {
        resEl.innerHTML = '<span style="color:var(--danger)">✗ ' + escapeHtml(r.error || '未知错误') + '</span>';
      }
    } catch (e) {
      resEl.innerHTML = '<span style="color:var(--danger)">✗ ' + escapeHtml(e.message) + '</span>';
    }
    this.disabled = false; this.textContent = '测试连通';
  });

  card.querySelector('#px_save_btn').addEventListener('click', async function() {
    const manual = card.querySelector('input[name="px_mode"]:checked').value === 'manual';
    const url = manual ? urlInput.value.trim() : '';
    if (manual && !url) { toast('请填写代理地址', 'error'); return; }
    this.disabled = true;
    try {
      await api('/proxy', { method: 'POST', body: JSON.stringify({ url }) });
      toast('代理设置已保存，即时生效', 'success');
      R.proxy();
    } catch (e) {
      toast(e.message, 'error');
      this.disabled = false;
    }
  });
};

R.clients = async function() {
  const c = gc();
  c.innerHTML = spinner();
  const ha = document.getElementById('headerActions');
  ha.innerHTML = '<button class="btn btn-primary btn-sm" id="createClientBtn">+ 创建 API Key</button>';
  document.getElementById('createClientBtn').addEventListener('click', function() { quickCreateKey(); });
  try {
    const clients = await api('/clients');
    // 平铺：一个名字对应一个 key，一行一个
    const rows = [];
    for (const cl of clients) {
      let keys = [];
      try { keys = await api('/clients/' + cl.id + '/keys'); } catch(e) {}
      keys.forEach(k => rows.push({
        name: cl.name || cl.id, cid: cl.id, kid: k.id || k.key_id,
        prefix: k.key_prefix || k.key || '', status: k.status
      }));
    }
    c.innerHTML = '';
    if (!rows.length) { c.innerHTML = '<div class="card text-sec">暂无 API Key，点击右上角「+ 创建 API Key」</div>'; return; }
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    let html = '<table><thead><tr><th>名称</th><th>API Key</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    rows.forEach(r => {
      const st = (r.status === 'active' || r.status === undefined) ? badge('活跃','green') : badge('停用','gray');
      html += '<tr><td>' + r.name + '</td>'
        + '<td class="text-sm" style="font-family:monospace">' + r.prefix + '</td>'
        + '<td>' + st + '</td>'
        + '<td class="flex gap-8">'
        + '<button class="btn btn-sm" data-cid="' + r.cid + '" data-kid="' + r.kid + '" data-action="copy">复制</button>'
        + '<button class="btn btn-sm btn-danger" data-cid="' + r.cid + '" data-kid="' + r.kid + '" data-action="del">删除</button>'
        + '</td></tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
    c.appendChild(wrap);

    c.querySelectorAll('[data-action="copy"]').forEach(b => b.addEventListener('click', function() { revealClientKey(this.dataset.cid, this.dataset.kid); }));
    c.querySelectorAll('[data-action="del"]').forEach(b => b.addEventListener('click', function() { deleteApiKey(this.dataset.cid, this.dataset.kid); }));
  } catch(e) {
    c.innerHTML = '<div class="card text-sec">加载失败: ' + e.message + '</div>';
  }
};

// 删除 API Key（连同其名字/客户一起清掉，保持一名一 key）
function deleteApiKey(cid, kid) {
  showModal('<div class="modal-header"><h3>确认删除</h3><button class="modal-close" onclick="closeModal()">x</button></div><div class="modal-body"><p>确定要删除这个 API Key 吗？删除后 agent 将无法再用它连接。此操作不可撤销。</p></div><div class="modal-footer"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-danger" id="confirmDelApiKey">删除</button></div>');
  document.getElementById('confirmDelApiKey').addEventListener('click', async function() {
    this.disabled = true;
    try {
      await api('/clients/' + cid + '/keys/' + kid, { method: 'DELETE' });
      // 若该客户已无其它 key，顺手删掉这个空名字
      try {
        const rest = await api('/clients/' + cid + '/keys');
        if (!rest.length) await api('/clients/' + cid, { method: 'DELETE' });
      } catch(e) {}
      closeModal(); toast('已删除', 'success'); R.clients();
    } catch(e) { toast(e.message, 'error'); this.disabled = false; }
  });
}

// 一步到位：填备注 → 自动建客户 → 立即生成 key → 弹出完整 sk-
function quickCreateKey() {
  showModal(
    '<div class="modal-header"><h3>创建 API Key</h3><button class="modal-close" onclick="closeModal()">x</button></div>' +
    '<div class="modal-body">' +
    '<div class="form-group"><label>备注名称</label><input id="qk_name" placeholder="例如：我的agent"></div>' +
    '<p class="text-sec" style="font-size:12px">创建后会立即生成一个 sk- 开头的 API Key，填进 agent 即可使用。</p>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="qkSaveBtn">创建</button></div>'
  );
  document.getElementById('qkSaveBtn').addEventListener('click', async function() {
    const nm = (document.getElementById('qk_name').value || '').trim();
    if (!nm) { toast('请填写备注名称', 'error'); return; }
    this.disabled = true;
    try {
      // 校验重名
      const existing = await api('/clients');
      if (existing.some(c => (c.name || '').trim() === nm)) {
        toast('名称「' + nm + '」已存在，请换一个', 'error');
        this.disabled = false; return;
      }
      const cl = await api('/clients', { method: 'POST', body: JSON.stringify({ name: nm, user_type: 'new' }) });
      const cid = cl.id || cl.client_id;
      const r = await api('/clients/' + cid + '/keys', { method: 'POST', body: JSON.stringify({ name: nm }) });
      showClientKeyResult(cid, r.key);
    } catch(e) { toast(e.message, 'error'); this.disabled = false; }
  });
}

/* ================================================================ */
/*  LOGS (请求日志)                                                   */
/* ================================================================ */
function formatLogTokens(l) {
  const p = Number(l.prompt_tokens || 0);
  const c = Number(l.completion_tokens || 0);
  const cached = Number(l.cached_tokens || 0);
  const total = Number(l.total_tokens || 0);

  if (p === 0 && c === 0 && total === 0) {
    return '<span class="text-dim">-</span>';
  }

  const mainText = `${p.toLocaleString()} / ${c.toLocaleString()}`;
  let cacheHtml = '';
  if (cached > 0) {
    cacheHtml = `<div style="font-size:11.5px;color:var(--text-sec);margin-top:2px;line-height:1.2;font-variant-numeric:tabular-nums;font-weight:400;">缓存&darr; ${cached.toLocaleString()}</div>`;
  }
  return `<div style="line-height:1.35;font-variant-numeric:tabular-nums;"><div style="font-size:13px;color:var(--text);font-weight:500;">${mainText}</div>${cacheHtml}</div>`;
}

function formatLogCost(l) {
  const cost = Number(l.cost || 0);
  const curr = (l.currency || 'USD').toUpperCase();
  const symbol = curr === 'CNY' ? '¥' : '$';
  if (cost <= 0) {
    if ((l.total_tokens > 0 || l.prompt_tokens > 0) && l.status_code == 200) {
      return `<span style="font-size:13px;color:var(--text-sec);font-variant-numeric:tabular-nums;">${symbol}0.0000</span>`;
    }
    return '<span class="text-dim">-</span>';
  }
  const costStr = cost < 0.0001 ? cost.toFixed(6) : cost.toFixed(4);
  return `<span style="font-size:13px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;">${symbol}${costStr}</span>`;
}

R.logs = async function(page) {
  if (!page) page = 1;
  window._currentLogsPage = page;
  const c = gc();
  c.innerHTML = spinner();
  const ha = document.getElementById('headerActions');
  ha.innerHTML = '';
  try {
    // === Fetch stats and logs in parallel ===
    let stats = null;
    try { stats = await api('/request-logs-stats/summary'); } catch(e) { /* ignore */ }
    let dash = null;
    if (!stats || stats.today == null) {
      try { dash = await api('/dashboard'); } catch(e) { /* ignore */ }
    }

    // === Build stats summary section ===
    let statsHtml = '';
    if (stats) {
      const todayObj = stats.today || dash?.today || null;
      const todayTotal = todayObj?.total_requests ?? stats.today_total ?? 0;
      const todayRate = todayTotal > 0 ? (todayObj?.success_rate ?? stats.today_success_rate ?? null) : null;
      const histTotal = stats.total ?? 0;
      const histRate = histTotal > 0 ? (stats.success_rate ?? null) : null;
      const todayColor = todayRate == null ? 'var(--text)' : (todayRate >= 80 ? 'var(--success)' : (todayRate >= 60 ? 'var(--warning)' : 'var(--danger)'));
      const histColor = histRate == null ? 'var(--text)' : (histRate >= 80 ? 'var(--success)' : (histRate >= 60 ? 'var(--warning)' : 'var(--danger)'));

      statsHtml = '<div class="stat-grid" style="margin-bottom:14px">' +
        '<div class="stat-card"><div class="stat-label">今日请求</div><div class="stat-value">' + todayTotal.toLocaleString() + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">今日成功率</div><div class="stat-value" style="color:' + todayColor + '">' + formatPercent(todayRate) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">历史总请求</div><div class="stat-value">' + histTotal.toLocaleString() + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">历史成功率</div><div class="stat-value" style="color:' + histColor + '">' + formatPercent(histRate) + '</div></div>' +
        '</div>';
    }

    // === Fetch logs ===
    const params = new URLSearchParams({ page: page, page_size: 20 });
    ['status_code','model','client_id'].forEach(k => {
      const el = document.getElementById('filt' + k.charAt(0).toUpperCase() + k.slice(1));
      if (el && el.value) params.set(k, el.value);
    });

    const data = await api('/request-logs?' + params.toString());
    c.innerHTML = '';
    if (statsHtml) c.innerHTML += statsHtml;

    const logs = data.data || data.items || data.records || [];
    const total = data.total || logs.length || 0;
    const totalPages = data.total_pages || data.totalPages || Math.ceil(total / 20) || 1;

    // === Logs table (8列: 时间, 客户端, 模型, 状态码, 延迟, Token, 费用, 操作) ===
    if (logs.length) {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      let html = '<table class="logs-table"><thead><tr>' +
        '<th style="width:16%">时间</th>' +
        '<th style="width:12%">客户端</th>' +
        '<th style="width:20%">模型</th>' +
        '<th style="width:8%">状态码</th>' +
        '<th style="width:10%">延迟</th>' +
        '<th style="width:16%">Token</th>' +
        '<th style="width:10%">费用</th>' +
        '<th style="width:8%">操作</th>' +
        '</tr></thead><tbody>';
      logs.forEach(l => {
        const ts = (l.created_at || '').slice(0, 19).replace('T', ' ');
        const sc = l.status_code;
        const scColor = sc == 200 ? 'var(--success)' : (sc >= 500 ? 'var(--danger)' : (sc >= 400 ? 'var(--warning)' : 'var(--text)'));
        html += '<tr>' +
          '<td class="text-sm" style="white-space:nowrap">' + ts + '</td>' +
          '<td class="text-sm truncate" title="' + escapeHtml(l.client_name || l.client_id || '') + '">' + escapeHtml(l.client_name || l.client_id || '-') + '</td>' +
          '<td class="text-sm truncate" title="' + escapeHtml(l.model || '') + '">' + escapeHtml(l.model || '-') + '</td>' +
          '<td style="color:' + scColor + ';font-weight:600">' + (sc ?? '-') + '</td>' +
          '<td>' + formatLatency(l.latency_ms) + '</td>' +
          '<td>' + formatLogTokens(l) + '</td>' +
          '<td>' + formatLogCost(l) + '</td>' +
          '<td><button class="btn btn-sm" data-id="' + l.id + '" onclick="viewLogDetail(\'' + l.id + '\')">详情</button></td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
      c.appendChild(wrap);

      const pg = pagination(page, total, totalPages, function(np) { R.logs(np); });
      c.appendChild(pg);
    } else {
      c.innerHTML += '<div class="card text-sec">暂无日志记录</div>';
    }

    // === 表格下方：成本定价板块（参考图1、图2） ===
    await renderPricingSection(c, function() {
      R.logs(page);
    });

    document.getElementById('searchLogsBtn')?.addEventListener('click', function() { R.logs(1); });
  } catch(e) {
    c.innerHTML = '<div class="card text-sec">加载失败: ' + e.message + '</div>';
  }
};

  const body = card.querySelector('#pricingBody');

        '<label class="pricing-field-label">显示名称</label>' +

        '<label class="pricing-field-label">计价货币</label>' +

          '<button type="button" class="pricing-curr-btn ' + (isUSD ? 'active' : '') + '" id="currBtnUSD">USD ($ 美元)</button>' +
          '<button type="button" class="pricing-curr-btn ' + (!isUSD ? 'active' : '') + '" id="currBtnCNY">CNY (¥ 人民币)</button>' +

        '<label class="pricing-field-label" id="labelInputCost">输入成本 (每百万 tokens, ' + currUnit + ')</label>' +
        '<input type="number" step="any" min="0" id="pricingInputCost" class="pricing-input" value="0" />' +

  function renderPricingsTable() {

      wrap.innerHTML = '<div style="padding:14px;border:1px dashed var(--border);border-radius:8px;color:var(--text-dim);font-size:12px;text-align:center;">暂无定价规则，请在上方设置并保存</div>';
      return;
    }

    let tHtml = '<div class="table-wrap"><table style="font-size:12px;"><thead><tr>' +
      '<th>模型 ID</th>' +
      '<th>显示名称</th>' +
      '<th>币种</th>' +
      '<th>输入成本 / 1M</th>' +
      '<th>输出成本 / 1M</th>' +
      '<th>缓存读取 / 1M</th>' +
      '<th>缓存写入 / 1M</th>' +
      '<th style="width:110px">操作</th>' +
      '</tr></thead><tbody>';

    existingPricings.forEach(p => {
      const sym = (p.currency === 'CNY') ? '¥' : '$';
      tHtml += '<tr>' +
        '<td style="font-weight:600;">' + escapeHtml(p.model_id) + '</td>' +
        '<td>' + escapeHtml(p.display_name || '-') + '</td>' +
        '<td><span class="badge" style="background:var(--accent-soft);color:var(--text);">' + escapeHtml(p.currency || 'USD') + '</span></td>' +
        '<td style="font-variant-numeric:tabular-nums;">' + sym + Number(p.input_cost || 0) + '</td>' +
        '<td style="font-variant-numeric:tabular-nums;">' + sym + Number(p.output_cost || 0) + '</td>' +
        '<td style="font-variant-numeric:tabular-nums;">' + sym + Number(p.cache_read_cost || 0) + '</td>' +
        '<td style="font-variant-numeric:tabular-nums;">' + sym + Number(p.cache_write_cost || 0) + '</td>' +
        '<td>' +
          '<button class="btn btn-sm edit-pricing-btn" data-id="' + p.id + '" style="margin-right:6px;">编辑</button>' +

        '</td>' +
        '</tr>';

        e.stopPropagation();

        if (item) {
          fillFormWithRule(item);
          toast('已载入规则: ' + item.model_id, 'info');
        }
      });

    wrap.querySelectorAll('.del-pricing-btn').forEach(btn => {
      btn.addEventListener('click', async function(e) {

          await api('/model-pricing/' + pid, { method: 'DELETE' });

  function fillFormWithRule(item) {
    const mIdInput = body.querySelector('#pricingModelId');

    const inCostInput = body.querySelector('#pricingInputCost');
    const outCostInput = body.querySelector('#pricingOutputCost');
    const crCostInput = body.querySelector('#pricingCacheReadCost');
    const cwCostInput = body.querySelector('#pricingCacheWriteCost');

    if (mIdInput) mIdInput.value = item.model_id || '';
    if (dNameInput) dNameInput.value = item.display_name || '';
    if (inCostInput) inCostInput.value = item.input_cost ?? 0;
    if (outCostInput) outCostInput.value = item.output_cost ?? 0;
    if (crCostInput) crCostInput.value = item.cache_read_cost ?? 0;
    if (cwCostInput) cwCostInput.value = item.cache_write_cost ?? 0;

    window._pricingCurrency = (item.currency || 'USD').toUpperCase();
    updateCurrencyUI();
  }

  function updateCurrencyUI() {
    const isUSD = window._pricingCurrency === 'USD';
    const currUnit = isUSD ? 'USD' : 'CNY';
    const btnUSD = body.querySelector('#currBtnUSD');
    const btnCNY = body.querySelector('#currBtnCNY');
    if (btnUSD) btnUSD.classList.toggle('active', isUSD);
    if (btnCNY) btnCNY.classList.toggle('active', !isUSD);

    const l1 = body.querySelector('#labelInputCost');
    const l2 = body.querySelector('#labelOutputCost');
    const l3 = body.querySelector('#labelCacheReadCost');
    const l4 = body.querySelector('#labelCacheWriteCost');
    if (l1) l1.textContent = '输入成本 (每百万 tokens, ' + currUnit + ')';
    if (l2) l2.textContent = '输出成本 (每百万 tokens, ' + currUnit + ')';
    if (l3) l3.textContent = '缓存读取成本 (每百万 tokens, ' + currUnit + ')';
    if (l4) l4.textContent = '缓存写入成本 (每百万 tokens, ' + currUnit + ')';
  }

  function bindEvents() {
    // 预设选择下拉框联动
    const sel = body.querySelector('#pricingPresetSelect');
    if (sel) {
      sel.addEventListener('change', function() {
        const val = this.value;
        if (!val) return;
        const opt = this.options[this.selectedIndex];
        const mName = opt.getAttribute('data-model') || val;
        const prov = opt.getAttribute('data-provider') || '';

        const mIdInput = body.querySelector('#pricingModelId');
        const dNameInput = body.querySelector('#pricingDisplayName');
        if (mIdInput) mIdInput.value = val;
        if (dNameInput) dNameInput.value = mName;

        // 尝试自动匹配已有定价规则
        const matched = existingPricings.find(x => x.model_id === val || x.model_id === mName);
        if (matched) {
          fillFormWithRule(matched);
        } else {
          // 默认清零
          const inCostInput = body.querySelector('#pricingInputCost');
          const outCostInput = body.querySelector('#pricingOutputCost');
          const crCostInput = body.querySelector('#pricingCacheReadCost');
          const cwCostInput = body.querySelector('#pricingCacheWriteCost');
          if (inCostInput) inCostInput.value = '0';
          if (outCostInput) outCostInput.value = '0';
          if (crCostInput) crCostInput.value = '0';
          if (cwCostInput) cwCostInput.value = '0';
        }
      });
    }

    // 货币切换
    const btnUSD = body.querySelector('#currBtnUSD');
    const btnCNY = body.querySelector('#currBtnCNY');
    if (btnUSD) {
      btnUSD.addEventListener('click', function() {
        window._pricingCurrency = 'USD';
        updateCurrencyUI();
      });
    }
    if (btnCNY) {
      btnCNY.addEventListener('click', function() {
        window._pricingCurrency = 'CNY';
        updateCurrencyUI();
      });
    }

    // 重置按钮
    const resetBtn = body.querySelector('#resetPricingBtn');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        const mIdInput = body.querySelector('#pricingModelId');
        const dNameInput = body.querySelector('#pricingDisplayName');
        const inCostInput = body.querySelector('#pricingInputCost');
        const outCostInput = body.querySelector('#pricingOutputCost');
        const crCostInput = body.querySelector('#pricingCacheReadCost');
        const cwCostInput = body.querySelector('#pricingCacheWriteCost');
        if (sel) sel.value = '';
        if (mIdInput) mIdInput.value = '';
        if (dNameInput) dNameInput.value = '';
        if (inCostInput) inCostInput.value = '0';
        if (outCostInput) outCostInput.value = '0';
        if (crCostInput) crCostInput.value = '0';
        if (cwCostInput) cwCostInput.value = '0';
        window._pricingCurrency = 'USD';
        updateCurrencyUI();
      });
    }

    // 保存按钮
    const saveBtn = body.querySelector('#savePricingBtn');
    if (saveBtn) {
      saveBtn.addEventListener('click', async function() {
        const mIdInput = body.querySelector('#pricingModelId');
        const dNameInput = body.querySelector('#pricingDisplayName');
        const inCostInput = body.querySelector('#pricingInputCost');
        const outCostInput = body.querySelector('#pricingOutputCost');
        const crCostInput = body.querySelector('#pricingCacheReadCost');
        const cwCostInput = body.querySelector('#pricingCacheWriteCost');

        const modelId = (mIdInput ? mIdInput.value : '').trim();
        if (!modelId) {
          toast('请输入或选择模型 ID', 'warning');
          if (mIdInput) mIdInput.focus();
          return;
        }

        const displayName = (dNameInput ? dNameInput.value : '').trim();
        const payload = {
          model_id: modelId,
          display_name: displayName || modelId,
          currency: window._pricingCurrency || 'USD',
          input_cost: parseFloat(inCostInput?.value || 0) || 0,
          output_cost: parseFloat(outCostInput?.value || 0) || 0,
          cache_read_cost: parseFloat(crCostInput?.value || 0) || 0,
          cache_write_cost: parseFloat(cwCostInput?.value || 0) || 0,
        };

        saveBtn.disabled = true;
        saveBtn.textContent = '保存中...';
        try {
          await api('/model-pricing', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          toast('成本定价规则保存成功', 'success');
          // 重新拉取列表
          const pr = await api('/model-pricing');
          existingPricings = pr.data || [];
          renderPricingsTable();
          if (typeof onUpdate === 'function') onUpdate();
        } catch(err) {
          toast(err.message, 'error');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存定价规则';
        }
      });
    }
  }

  renderBody();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatLatency(ms) {
  if (ms === null || ms === undefined || ms === '') return '-';
  ms = Number(ms);
  if (isNaN(ms)) return '-';
  if (ms >= 60000) return (ms / 60000).toFixed(1) + 'm';
  if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
  return ms + 'ms';
}

/* ---------- Markdown 渲染 ---------- */
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function mdLink(url, txt) {
  const safeUrl = /^(https?:\/\/|mailto:)/i.test(url) ? url : 'https://' + url;
  return '<a class="md-link" href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">' + CHAT_ICONS.globe + '<span>' + txt + '</span></a>';
}

function mdInline(text) {
  const codes = [];
  let t = text.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0000C' + (codes.length - 1) + '\u0000'; });
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) => '<img src="' + src + '" alt="' + alt + '" style="max-width:100%;border-radius:10px;vertical-align:top;">');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => mdLink(url, txt));
  t = t.replace(/(^|[\s(（>：；，、！？])((?:https?:\/\/|www\.)[^\s<>"'）】，。；：！？、]+)/g, (m, pre, url) => {
    const trimmed = url.replace(/[)\]}.,;:!?'"]+$/, '');
    return pre + mdLink(trimmed.startsWith('www.') ? 'https://' + trimmed : trimmed, trimmed);
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  t = t.replace(/\u0000C(\d+)\u0000/g, (m, i) => '<code class="inline">' + escapeHtml(codes[+i]) + '</code>');
  return t;
}

function splitMdRow(line) {
  return line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
}

function buildMdList(items, ordered) {
  const tag = ordered ? 'ol' : 'ul';
  let html = ''; let i = 0;
  while (i < items.length) {
    const it = items[i]; i++;
    let li = '<li>' + mdInline(it.text);
    const sub = [];
    while (i < items.length && items[i].indent >= 2) { sub.push(items[i]); i++; }
    if (sub.length) li += '<' + tag + '>' + sub.map(s => '<li>' + mdInline(s.text) + '</li>').join('') + '</' + tag + '>';
    li += '</li>';
    html += li;
  }
  return '<' + tag + '>' + html + '</' + tag + '>';
}

function mdBlocks(src) {
  if (!src.trim()) return '';
  const lines = src.split('\n');
  const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m = line.match(/^(#{1,4})\s+(.*)$/);
    if (m) { out.push('<h' + m[1].length + '>' + mdInline(escapeHtml(m[2])) + '</h' + m[1].length + '>'); i++; continue; }
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + mdBlocks(buf.join('\n')) + '</blockquote>');
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(lines[i+1])) {
      const header = splitMdRow(line); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) { rows.push(splitMdRow(lines[i])); i++; }
      let tbl = '<table><thead><tr>' + header.map(h => '<th>' + mdInline(escapeHtml(h)) + '</th>').join('') + '</tr></thead><tbody>';
      rows.forEach(r => { tbl += '<tr>' + r.map(c => '<td>' + mdInline(escapeHtml(c)) + '</td>').join('') + '</tr>'; });
      tbl += '</tbody></table>';
      out.push(tbl);
      continue;
    }
    m = line.match(/^(\s*)([-*+]|\d+[.、)])\s+(.*)$/);
    if (m) {
      const items = [];
      const ordered = /\d/.test(m[2]);
      while (i < lines.length) {
        const mm = lines[i].match(/^(\s*)([-*+]|\d+[.、)])\s+(.*)$/);
        if (mm) { items.push({ indent: mm[1].length, text: escapeHtml(mm[3]) }); i++; }
        else if (lines[i].trim() && /^\s{2,}\S/.test(lines[i]) && items.length) { items[items.length - 1].text += '<br>' + escapeHtml(lines[i].trim()); i++; }
        else break;
      }
      out.push(buildMdList(items, ordered));
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*>\s?)/.test(lines[i]) && !/^(\s*)([-*+]|\d+[.、)])\s+/.test(lines[i]) && !/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    if (!buf.length) { buf.push(lines[i]); i++; }
    out.push('<p>' + mdInline(escapeHtml(buf.join('\n'))).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}

/* ---------- 数学公式（KaTeX） ---------- */
/* 在 Markdown 解析前把公式提取为私有区占位符（U+E000 不会被 escapeHtml/HTML 解析破坏），
   避免 \frac、|x|、* 等被块级/行内规则误伤；行内代码先摘出，防止 `code` 里的 $ 被当公式。 */
const _mathStore = [];
const _codeGuard = [];

function katexRender(tex, display) {
  try {
    if (window.katex) return katex.renderToString(tex, { displayMode: display, throwOnError: false, strict: 'ignore' });
  } catch (e) { /* 渲染失败回退原文 */ }
  return '<code class="md-math-raw">' + escapeHtml(tex) + '</code>';
}

function mdMathExtract(text) {
  _mathStore.length = 0; _codeGuard.length = 0;
  // 1) 行内代码先行摘出（原样保留，最后还原）
  let t = text.replace(/`[^`\n]+`/g, (m) => { _codeGuard.push(m); return '\uE002K' + (_codeGuard.length - 1) + '\uE003'; });
  // 2) 显示公式 $$...$$ 与 \[...\]（可跨行）
  t = t.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => { _mathStore.push({ tex: tex.trim(), display: true }); return '\uE000M' + (_mathStore.length - 1) + '\uE001'; });
  t = t.replace(/\\\[([\s\S]+?)\\\]/g, (m, tex) => { _mathStore.push({ tex: tex.trim(), display: true }); return '\uE000M' + (_mathStore.length - 1) + '\uE001'; });
  // 3) 行内公式 \(...\)
  t = t.replace(/\\\(([\s\S]+?)\\\)/g, (m, tex) => { _mathStore.push({ tex: tex.trim(), display: false }); return '\uE000M' + (_mathStore.length - 1) + '\uE001'; });
  // 4) 行内 $...$：排除转义/标识符邻接，排除首尾空白与纯数字（金额），内容不跨行
  t = t.replace(/(^|[^\w$\\])\$([^$\n]+?)\$(?![\w$])/g, (m, pre, tex) => {
    if (!tex.trim() || /^\s|\s$/.test(tex) || /^\d+([.,]\d+)*$/.test(tex.trim())) return m;
    _mathStore.push({ tex: tex.trim(), display: false });
    return pre + '\uE000M' + (_mathStore.length - 1) + '\uE001';
  });
  // 5) 还原行内代码
  t = t.replace(/\uE002K(\d+)\uE003/g, (m, i) => _codeGuard[+i]);
  return t;
}

function mdBlocksWithMath(seg) {
  if (!seg) return '';
  if (!/(\$|\\\(|\\\[)/.test(seg)) return mdBlocks(seg);
  const t = mdMathExtract(seg);
  let html = mdBlocks(t);
  if (_mathStore.length) {
    const store = _mathStore.slice();
    html = html.replace(/\uE000M(\d+)\uE001/g, (m, i) => {
      const it = store[+i];
      if (!it) return m;
      return '<span class="md-math' + (it.display ? ' md-math-display' : '') + '">' + katexRender(it.tex, it.display) + '</span>';
    });
  }
  return html;
}

let _codeSeq = 0; const _codeStore = {};
function buildCodeBlock(lang, code, closed) {
  const id = 'cb' + (++_codeSeq);
  _codeStore[id] = code;
  return '<div class="code-block" data-code-id="' + id + '"><div class="code-head"><span>' + escapeHtml(lang || '代码') + (closed ? '' : ' · 输出中') + '</span><button class="code-copy">' + CHAT_ICONS.copy + '复制</button></div><pre><code>' + escapeHtml(code) + '</code></pre></div>';
}

function mdRender(src) {
  if (!src) return '';
  let out = ''; let pos = 0;
  while (true) {
    const idx = src.indexOf('```', pos);
    if (idx === -1) { out += mdBlocksWithMath(src.slice(pos)); break; }
    out += mdBlocksWithMath(src.slice(pos, idx));
    const nl = src.indexOf('\n', idx);
    let lang = '', bodyStart;
    if (nl === -1) { bodyStart = src.length; }
    else { lang = src.slice(idx + 3, nl).trim(); bodyStart = nl + 1; }
    let close = src.indexOf('```', bodyStart);
    const closed = close !== -1;
    if (close === -1) close = src.length;
    const code = src.slice(bodyStart, close).replace(/\n$/, '');
    out += buildCodeBlock(lang, code, closed);
    pos = close + 3;
    if (close >= src.length) break;
  }
  return out;
}

/* ---------- 会话侧栏 ---------- */
function chatGroupLabel(iso) {
  const d = new Date(iso);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (d >= today) return '今天';
  if (d >= new Date(today.getTime() - 6 * 864e5)) return '7天内';
  if (d >= new Date(today.getTime() - 29 * 864e5)) return '30天内';
  return '更早';
}

async function chatLoadSessions() {
  try {
    CS.sessions = await api('/chat/sessions');
  } catch (e) { CS.sessions = []; }
  chatRenderSessions();
}

function chatRenderSessions() {
  const box = document.getElementById('chatSessions');
  if (!box) return;
  box.innerHTML = '';
  if (!CS.sessions.length) {
    box.innerHTML = '<div class="chat-group-label" style="justify-content:center;">暂无历史会话</div>';
    return;
  }
  const order = ['今天', '7天内', '30天内', '更早'];
  const groups = {};
  CS.sessions.forEach(s => {
    const g = chatGroupLabel(s.updated_at);
    (groups[g] = groups[g] || []).push(s);
  });
  order.forEach(g => {
    if (!groups[g]) return;
    const label = document.createElement('div');
    label.className = 'chat-group-label';
    label.innerHTML = '<span>' + g + '</span><span>' + groups[g].length + '</span>';
    box.appendChild(label);
    groups[g].forEach(s => {
      const item = document.createElement('div');
      item.className = 'chat-session-item' + (s.id === CS.sid ? ' active' : '');
      item.innerHTML = '<span class="chat-session-title" title="' + escapeHtml(s.title) + '">' + escapeHtml(s.title) + '</span>' +
        '<span class="chat-session-acts"><button data-act="rename" title="重命名">' + CHAT_ICONS.edit + '</button><button data-act="del" title="删除">' + CHAT_ICONS.trash + '</button></span>';
      item.addEventListener('click', (ev) => {
        const act = ev.target.closest('[data-act]');
        if (act) {
          ev.stopPropagation();
          if (act.dataset.act === 'rename') chatRenameSession(s);
          else chatDeleteSession(s);
          return;
        }
        chatOpenSession(s.id);
      });
      box.appendChild(item);
    });
  });
}

function chatRenameSession(s) {
  showModal('<div class="modal-header"><h3>重命名会话</h3><button class="modal-close" onclick="closeModal()"></button></div>' +
    '<div class="modal-body"><div class="form-group"><label>会话名称</label><input id="crsInput" value="' + escapeHtml(s.title) + '" maxlength="60"></div></div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="crsSave">保存</button></div>');
  document.getElementById('crsInput').focus();
  document.getElementById('crsSave').addEventListener('click', async () => {
    const title = document.getElementById('crsInput').value.trim();
    if (!title) { toast('标题不能为空', 'error'); return; }
    try {
      await api('/chat/sessions/' + s.id, { method: 'PUT', body: JSON.stringify({ title }) });
      closeModal(); toast('已重命名', 'success');
      chatLoadSessions();
      if (s.id === CS.sid) { const t = document.getElementById('chatTopTitle'); if (t) t.textContent = title; }
    } catch (e) { toast(e.message, 'error'); }
  });
}

function chatDeleteSession(s) {
  showModal('<div class="modal-header"><h3>删除会话</h3><button class="modal-close" onclick="closeModal()"></button></div>' +
    '<div class="modal-body"><div class="text-sec" style="font-size:13.5px;">确定删除「<b style="color:var(--text)">' + escapeHtml(s.title) + '</b>」及其全部消息？此操作不可恢复。</div></div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-danger" id="cdsSure">删除</button></div>');
  document.getElementById('cdsSure').addEventListener('click', async () => {
    try {
      await api('/chat/sessions/' + s.id, { method: 'DELETE' });
      closeModal(); toast('会话已删除', 'success');
      if (s.id === CS.sid) { CS.sid = null; CS.msgs = []; chatRenderMessages(); chatUpdateSendBtn(); }
      chatLoadSessions();
    } catch (e) { toast(e.message, 'error'); }
  });
}

/* ---------- 消息渲染 ---------- */
function chatAttachGridHtml(atts) {
  if (!atts || !atts.length) return '';
  let h = '<div class="msg-attach-grid">';
  atts.forEach((a, idx) => {
    if (a.kind === 'image') {
      h += '<img class="msg-img-thumb" src="' + a.data + '" alt="' + escapeHtml(a.name) + '" data-full="' + a.data + '" data-name="' + escapeHtml(a.name) + '" data-size="' + (a.size || '') + '" title="点击查看大图">';
    } else {
      h += '<span class="msg-file-chip" data-idx="' + idx + '" title="点击查看文件">' + CHAT_ICONS.file + '<span class="chip-name">' + escapeHtml(a.name) + '</span></span>';
    }
  });
  return h + '</div>';
}

function reasoningShell(uid, open, label, bodyHtml) {
  return '<div class="reasoning" id="reasoning-' + uid + '" data-open="' + (open ? 1 : 0) + '">' +
    '<div class="reasoning-head" data-uid="' + uid + '">' + CHAT_ICONS.bulb + '<span class="reasoning-label">' + label + '</span>' + CHAT_ICONS.chev + '</div>' +
    '<div class="reasoning-body" id="reasoning-body-' + uid + '">' + bodyHtml + '</div></div>';
}

function buildUserRow(m, opts) {
  opts = opts || {};
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.id = 'row-' + m.uid;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble-user';
  if (opts.editing) {
    // rewind 编辑态：气泡内变为可编辑文本域
    bubble.innerHTML = chatAttachGridHtml(m.attachments) +
      '<textarea class="rewind-editor" id="rewind-ta-' + m.uid + '" rows="3">' + escapeHtml(m.content) + '</textarea>' +
      '<div class="rewind-acts">' +
        '<button class="rw-btn" data-rewind-cancel="' + m.uid + '">取消</button>' +
        '<button class="rw-btn rw-send" data-rewind-send="' + m.uid + '">发送</button>' +
      '</div>';
  } else {
    bubble.innerHTML = chatAttachGridHtml(m.attachments) +
      (m.content ? '<div class="msg-user-text">' + mdInline(escapeHtml(m.content)) + '</div>' : '');
  }
  row.appendChild(bubble);
  if (!opts.editing) {
    // 气泡下方操作行：复制 + 编辑重发（rewind），右对齐
    const acts = document.createElement('div');
    acts.className = 'msg-user-acts';
    acts.innerHTML = '<button class="msg-copy-btn user-act" data-copy-uid="' + m.uid + '" title="复制">' + CHAT_ICONS.copy + '</button>' +
      '<button class="user-act" data-rewind="' + m.uid + '" title="编辑重发（rewind）">' + CHAT_ICONS.edit + '</button>';
    row.appendChild(acts);
  }
  return row;
}

function buildAssistantRow(m, opts) {
  opts = opts || {};
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = 'row-' + m.uid;
  const time = m.created_at ? new Date(m.created_at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
  let inner = '<img class="msg-avatar" src="/static/brand.png" alt="Master API">' +
    '<div class="msg-assist-body"><div class="msg-meta"><span class="msg-model">Master API</span>' +
    (m.model ? '<span class="msg-time">' + escapeHtml(m.model) + (time ? ' · ' + time : '') + '</span>' : (time ? '<span class="msg-time">' + time + '</span>' : '')) +
    '</div>';
  if (m.reasoning) {
    const thinking = opts.streaming && !m._reasoningDone;
    inner += reasoningShell(m.uid, thinking, thinking ? '正在深度思考<span class="reasoning-thinking-dot"><i></i><i></i><i></i></span>' : '已深度思考' + (m.reasoningSecs ? '（用时 ' + m.reasoningSecs + ' 秒）' : ''), escapeHtml(m.reasoning || ''));
  }
  inner += '<div class="msg-md" id="md-' + m.uid + '">' + mdRender(m.content) + '</div>';
  if (m.error) {
    inner += '<div class="msg-error" id="err-' + m.uid + '">' +
      '<span class="msg-error-text">❌ ' + escapeHtml(m.error) + '</span>' +
      '<button class="msg-retry-btn" data-retry-uid="' + m.uid + '" title="重试">' + CHAT_ICONS.refresh + '重试</button>' +
      '</div>';
  }
  if (!opts.streaming && m.content) {
    inner += '<button class="msg-copy-btn" data-copy-uid="' + m.uid + '">' + CHAT_ICONS.copy + '复制</button>';
  }
  inner += '</div>';
  row.innerHTML = inner;
  return row;
}

function chatRenderMessages() {
  const box = chatUx();
  if (!box) return;
  box.innerHTML = '';
  if (!CS.msgs.length) {
    box.innerHTML = '<div class="chat-hero"><img class="chat-hero-logo" src="/static/brand.png" alt="Master API"><div class="chat-hero-title">你好，让我们开始聊天吧</div></div>';
    return;
  }
  const inner = document.createElement('div');
  inner.className = 'chat-msgs-inner';
  CS.msgs.forEach(m => {
    inner.appendChild(m.role === 'user' ? buildUserRow(m) : buildAssistantRow(m, {}));
  });
  box.appendChild(inner);
  box.scrollTop = box.scrollHeight;
}

function chatScrollBottom(force) {
  const box = chatUx();
  if (!box) return;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  if (force || nearBottom) box.scrollTop = box.scrollHeight;
}

/* ---------- 消息消息容器事件（思考折叠 / 代码复制 / 图片放大 / 选择器外点关闭） ---------- */
document.addEventListener('click', function(ev) {
  if (typeof CS !== 'undefined' && CS.pillOpen && !ev.target.closest('.chat-pill-wrap')) {
    chatTogglePillPop(false);
  }
  const head = ev.target.closest('.reasoning-head');
  if (head) {
    const box = head.closest('.reasoning');
    box.dataset.open = box.dataset.open === '1' ? '0' : '1';
    return;
  }
  const cp = ev.target.closest('.code-copy');
  if (cp) {
    const blk = cp.closest('.code-block');
    const code = _codeStore[blk.dataset.codeId] || blk.querySelector('code').textContent;
    navigator.clipboard.writeText(code).then(() => { cp.innerHTML = CHAT_ICONS.copy + '已复制'; setTimeout(() => { cp.innerHTML = CHAT_ICONS.copy + '复制'; }, 1500); });
    return;
  }
  const mcp = ev.target.closest('.msg-copy-btn');
  if (mcp) {
    const m = CS.msgs.find(x => x.uid === mcp.dataset.copyUid);
    if (m) navigator.clipboard.writeText(m.content).then(() => toast('已复制到剪贴板', 'success'));
    return;
  }
  const retryBtn = ev.target.closest('[data-retry-uid]');
  if (retryBtn) {
    ev.stopPropagation();
    chatRetryMessage(retryBtn.dataset.retryUid);
    return;
  }
  const rwBtn = ev.target.closest('[data-rewind]');
  if (rwBtn) {
    ev.stopPropagation();
    const m = CS.msgs.find(x => x.uid === rwBtn.dataset.rewind);
    if (m) chatEnterRewindEdit(m);
    return;
  }
  const rwSend = ev.target.closest('[data-rewind-send]');
  if (rwSend) {
    ev.stopPropagation();
    const m = CS.msgs.find(x => x.uid === rwSend.dataset.rewindSend);
    if (m) chatConfirmRewind(m);
    return;
  }
  const rwCancel = ev.target.closest('[data-rewind-cancel]');
  if (rwCancel) {
    ev.stopPropagation();
    const m = CS.msgs.find(x => x.uid === rwCancel.dataset.rewindCancel);
    if (m) {
      const old = document.getElementById('row-' + m.uid);
      if (old) old.replaceWith(buildUserRow(m));
    }
    return;
  }
  const img = ev.target.closest('.msg-img-thumb');
  if (img) {
    chatPreviewImage(img.dataset.full || img.src, img.dataset.name || img.alt || '图片', img.dataset.size ? Number(img.dataset.size) : null);
    return;
  }
  const fileChip = ev.target.closest('.msg-file-chip');
  if (fileChip) {
    const row = fileChip.closest('.msg-row');
    if (row) {
      const uid = row.id ? row.id.replace('row-', '') : '';
      const m = CS.msgs.find(x => x.uid === uid);
      if (m && m.attachments) {
        const idx = Number(fileChip.dataset.idx || 0);
        const a = m.attachments[idx];
        if (a) {
          if (a.kind === 'doc-text') chatPreviewDoc(a.name, a.data, a.size);
          else if (a.kind === 'doc-pdf') chatPreviewPdf(a.name, a.data, a.size);
          else if (a.kind === 'image') chatPreviewImage(a.data, a.name, a.size);
        }
      }
    }
    return;
  }
});

/* ---------- 配置（模型走发送键旁选择器，localStorage 记忆；免 API Key，管理员登录态直调） ---------- */
async function chatLoadConfig() {
  try {
    const d = await api('/chat/config');
    CS.cfg.stream = d.stream !== false;
  } catch (e) { /* 保持默认 */ }
  // 恢复上次选择的模型与思考强度
  try {
    const saved = JSON.parse(localStorage.getItem('masterapi-chat-pill') || 'null');
    if (saved) {
      if (saved.model) CS.cfg.model = saved.model;
      if (CHAT_EFFORTS.includes(saved.effort)) CS.effort = saved.effort;
    }
  } catch (e) {}
  await chatLoadModels();
}

/* ---------- 模型 / 思考强度选择器（发送键旁） ---------- */
async function chatLoadModels() {
  // 直接使用「上游密钥」里配置的全部真实模型（provider::model 精确锁定上游），不受聚合模型限制
  try {
    const d = await api('/available-models');
    CS.models = (d.models || []).filter(m => m && m.id);
  } catch (e) { CS.models = CS.models || []; }
  // 已选模型失效（上游被删/改名）或从未选择过时，自动选第一个可用模型
  if (CS.models.length && !CS.models.some(m => m.id === CS.cfg.model)) {
    CS.cfg.model = CS.models[0].id;
  }
  chatSyncPill();
  chatRenderPillPop();
}

function chatActiveModel() {
  // 网页对话直接使用所选真实模型（provider::model 精确路由到该上游），不影响 agent 的聚合调用
  return CS.cfg.model;
}

function chatModelDisplayName() {
  const m = CS.cfg.model || '';
  const i = m.indexOf('::');
  return m ? (i > 0 ? m.slice(i + 2) : m) : '';
}

function chatSyncPill() {
  const nameEl = document.getElementById('chatPillName');
  if (!nameEl) return;
  nameEl.textContent = chatModelDisplayName() || '选择模型';
  const effEl = document.getElementById('chatPillEffort');
  if (effEl) effEl.textContent = CS.effort ? CS.effort.charAt(0).toUpperCase() + CS.effort.slice(1) : '';
  try { localStorage.setItem('masterapi-chat-pill', JSON.stringify({ model: CS.cfg.model, effort: CS.effort })); } catch (e) {}
}

function chatRenderPillPop() {
  const pop = document.getElementById('chatPillPop');
  if (!pop) return;
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  let html = '';
  if (CS.pillView === 'models') {
    // 子面板：全部上游模型（按供应商分组，选中项高亮）
    html += '<div class="pill-pop-back" data-view="root">' + CHAT_ICONS.chevL + '<span>模型</span></div>';
    if (!CS.models || !CS.models.length) {
      html += '<div class="pill-pop-group">暂无可用模型</div>';
      html += '<div class="pill-pop-item"><span>请先到「上游密钥」配置供应商与模型</span></div>';
    } else {
      const groups = [];
      CS.models.forEach(mm => {
        let g = groups.find(x => x.provider === mm.provider);
        if (!g) { g = { provider: mm.provider || '默认供应商', models: [] }; groups.push(g); }
        g.models.push(mm);
      });
      groups.forEach(g => {
        html += '<div class="pill-pop-group">' + escapeHtml(g.provider) + '</div>';
        g.models.forEach(mm => {
          html += '<div class="pill-pop-item' + (CS.cfg.model === mm.id ? ' selected' : '') + '" data-ref="' + escapeHtml(mm.id) + '">' +
            '<span>' + escapeHtml(mm.model_id || mm.id) + '</span></div>';
        });
      });
    }
  } else if (CS.pillView === 'efforts') {
    // 子面板：推理等级竖排，当前项打勾（图3样式）
    html += '<div class="pill-pop-back" data-view="root">' + CHAT_ICONS.chevL + '<span>推理等级</span></div>';
    html += CHAT_EFFORTS.map(e =>
      '<div class="pill-pop-item' + (CS.effort === e ? ' selected' : '') + '" data-effort="' + e + '"><span>' + cap(e) + '</span>' +
      (CS.effort === e ? '<span class="pill-check">' + CHAT_ICONS.check + '</span>' : '') + '</div>'
    ).join('');
  } else {
    // 根面板：两行菜单（图1样式）
